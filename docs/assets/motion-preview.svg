<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
<title id="title">Motion you can pause. A story you can explain.</title><desc id="description">Static conceptual illustrations of a fictional delivery network, a marketing funnel and an isometric warehouse. The live gallery supports play, pause, phase selection and scrubbing.</desc>
