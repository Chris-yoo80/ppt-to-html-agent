/* Data charts: drawn to scale; palette is overridable through these variables. */
:root{--chart-1:#3158db;--chart-2:#2f7d5b;--chart-3:#e07a2f;--chart-4:#7a5bd6;--chart-5:#c2416b;--chart-6:#5f8f2f;--chart-ink:#20251f;--chart-muted:#6a7564;--chart-grid:#e3e7dc}
.scene-body.has-chart{grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:36px;align-items:stretch}
.has-chart .item-list{align-content:center;gap:10px}
.has-chart .item{padding:14px 20px;grid-template-columns:40px 1fr;align-items:center}
/* Label and value share one row so four cards fit beside a chart. */
.has-chart .item>div{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:14px;align-items:baseline}
.has-chart .item h2{grid-row:1;grid-column:1;font-size:21px;margin:0}.has-chart .item-value{grid-row:1;grid-column:2;font-size:24px;margin:0;text-align:right}
.has-chart .item p{grid-row:2;grid-column:1/3;font-size:15px;margin-top:3px}
.has-chart.compare .item-list{grid-template-columns:1fr}
.chart-box{margin:0;background:#fff;border:1px solid #dce1d2;border-radius:20px;padding:22px 26px 16px;display:flex;flex-direction:column;min-height:0;box-shadow:0 14px 34px #20251f0d}
.chart-title{font-size:19px;font-weight:700;color:var(--chart-ink);margin:0 0 6px}
.chart-box svg{width:100%;flex:1;min-height:0;overflow:visible}
.chart-note{font-size:14px;color:var(--chart-muted);margin:6px 0 0;line-height:1.45}
.chart-grid{stroke:var(--chart-grid);stroke-width:1}.chart-baseline{stroke:#9aa392;stroke-width:1.5}
.chart-axis{font-size:13px;fill:var(--chart-muted)}
.chart-label{font-size:16px;fill:var(--chart-ink);font-weight:600}
.chart-value{font-size:18px;fill:var(--chart-ink);font-weight:800}
.chart-rate{font-size:15px;fill:var(--chart-muted);font-weight:600}
.chart-center{font-size:22px;font-weight:800;fill:var(--chart-ink)}
.series-0{fill:var(--chart-1)}.chart-bar.is-highlight,.chart-funnel.is-highlight{fill:var(--chart-3)}.series-1{fill:var(--chart-2)}.series-2{fill:var(--chart-3)}.series-3{fill:var(--chart-4)}.series-4{fill:var(--chart-5)}.series-5{fill:var(--chart-6)}
.chart-line{stroke:var(--chart-1);stroke-width:4;fill:none;stroke-linecap:round}
.chart-area{fill:var(--chart-1);opacity:.06}.chart-area.on{opacity:.12}
.chart-dot{fill:#fff;stroke:var(--chart-1);stroke-width:4}
.chart-bar,.chart-funnel,.chart-slice,.chart-key,.chart-line,.chart-dot,.chart-value,.chart-label,.chart-rate{opacity:.16}
.chart-bar.on,.chart-funnel.on,.chart-slice.on,.chart-key.on,.chart-line.on,.chart-dot.on,.chart-value.on,.chart-label.on,.chart-rate.on{opacity:1}
.chart-bar.active,.chart-funnel.active,.chart-slice.active{filter:drop-shadow(0 6px 10px #20251f30)}
@media print{.chart-bar,.chart-funnel,.chart-slice,.chart-key,.chart-line,.chart-dot,.chart-value,.chart-label,.chart-rate{opacity:1}.chart-box{box-shadow:none}}

/* Finite entrances: no unattended decorative looping. */
@keyframes point-in{from{opacity:.12;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes line-in{from{stroke-dashoffset:180;opacity:.12}to{stroke-dashoffset:0;opacity:1}}
@keyframes plane-in{from{opacity:.12;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes item-in{from{opacity:.22;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.motion-point.on.active{transform-box:fill-box;transform-origin:center;animation:point-in .6s ease both}
.motion-link.on.active{animation:line-in .9s ease both}
.motion-plane.on.active{animation:plane-in .7s ease both}
body.motion-rich .item.on.active{animation:item-in .45s ease both}
@media(prefers-reduced-motion:reduce){.motion-point.on.active,.motion-link.on.active,.motion-plane.on.active,body.motion-rich .item.on.active{animation:none;transition:none}}
/* Chart entrances: finite, data-preserving (final state equals the static chart). */
@keyframes chart-rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes chart-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes chart-pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes chart-draw{from{stroke-dasharray:600;stroke-dashoffset:600}to{stroke-dasharray:600;stroke-dashoffset:0}}
@keyframes chart-fade{from{opacity:0}}
.chart-bar.on.active,.chart-box.enter .chart-bar{transform-box:fill-box;transform-origin:bottom;animation:chart-rise .8s cubic-bezier(.2,.8,.2,1) both}
.chart-funnel.on.active,.chart-box.enter .chart-funnel{transform-box:fill-box;transform-origin:center;animation:chart-grow .8s cubic-bezier(.2,.8,.2,1) both}
.chart-slice.on.active,.chart-box.enter .chart-slice{transform-box:view-box;transform-origin:190px 190px;animation:chart-pop .7s ease both}
.chart-line.on.active,.chart-box.enter .chart-line{animation:chart-draw .9s ease both}
.chart-dot.on.active,.chart-value.on.active,.chart-rate.on.active,.chart-box.enter .chart-value{animation:chart-fade .6s .2s ease both}
.chart-box.enter .chart-bar,.chart-box.enter .chart-funnel{animation-delay:calc(var(--i,0)*.08s)}
body.motion-none .chart-box *{animation:none!important}
@media(prefers-reduced-motion:reduce){.chart-box *{animation:none!important}}

.k-panel p{margin:0}

/* Numbers */
.k-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.k-kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.k-kpi-label{font-size:14px;color:var(--k-muted);font-weight:600}
.k-kpi-value{font-size:42px;font-weight:800;color:var(--k-accent);line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.k-kpi-unit{font-size:18px;font-weight:700;margin-left:3px;color:var(--k-muted)}
.k-delta{font-size:14px;font-weight:800}.k-delta.up{color:var(--k-good)}.k-delta.down{color:var(--k-bad)}
.k-hero{background:linear-gradient(150deg,var(--k-accent),var(--k-accent-dark));color:#fff;border-radius:var(--k-radius);padding:24px 26px;display:flex;flex-direction:column;gap:8px}
.k-hero .k-kpi-value{color:#fff;font-size:68px}.k-hero .k-kpi-label,.k-hero .k-kpi-unit{color:#ffffffcc}
.k-panel.dark .k-kpi-value,.k-panel.accent .k-kpi-value{color:#fff}

/* Tables */
.k-table{width:100%;border-collapse:collapse;font-size:15px}
.k-table th{background:var(--k-soft);color:var(--k-accent-dark);font-weight:700;text-align:left;padding:8px 10px;border-bottom:2px solid var(--k-accent)}
.k-table td{padding:8px 10px;border-bottom:1px solid var(--k-line)}
.k-table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.k-table tr.hl td{background:var(--k-soft);font-weight:700}
.k-table tr.total td{border-top:2px solid var(--k-ink);font-weight:800}

/* Labels */
.k-chips{display:flex;flex-wrap:wrap;gap:6px}
.k-chip{display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;background:var(--k-soft);color:var(--k-accent-dark);font-size:13px;font-weight:700}
.k-tag{display:inline-flex;padding:2px 8px;border:1px solid var(--k-line);border-radius:6px;font-size:12px;color:var(--k-muted)}
.k-badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 8px;border-radius:13px;background:var(--k-accent);color:#fff;font-size:13px;font-weight:800}
.k-note{font-size:13px;color:var(--k-muted)}
.k-list{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.k-list li{position:relative;padding-left:16px}
.k-list li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--k-accent)}
.k-insight{display:flex;gap:14px;align-items:center;background:var(--k-panel);border:1px solid var(--k-line);border-left:5px solid var(--k-warn);border-radius:8px;padding:10px 16px;font-size:16px;font-weight:600}
.k-insight>b:first-child{flex:none;padding:3px 10px;border-radius:6px;background:var(--k-warn);color:#fff;font-size:13px}

/* Jumps to backup scenes */
button[data-goto]{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--k-accent);color:var(--k-accent);background:#fff;border-radius:7px;padding:5px 11px;cursor:pointer}
button[data-goto]::before{content:"▸ "}
button[data-goto]:hover{background:var(--k-accent);color:#fff}

/* Timeline (status list) */
.k-timeline{display:grid;gap:8px}
.k-tl-item{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:stretch}
.k-tl-date{display:grid;place-items:center;text-align:center;font-weight:800;color:var(--k-accent);background:var(--k-soft);border-radius:10px;padding:6px;font-size:14px}
.k-tl-item.now .k-tl-date{background:var(--k-accent);color:#fff}
.k-tl-body{border:1px solid var(--k-line);border-radius:10px;padding:8px 12px;background:var(--k-panel)}
.k-tl-item.now .k-tl-body{border-color:var(--k-accent)}
.k-tl-item.next .k-tl-body,.k-tl-item.next .k-tl-date{border-style:dashed;background:transparent}

/* Gantt: label column + N period columns; place bars with style="grid-column:3/6" */
.k-gantt{display:grid;grid-template-columns:var(--label,170px) repeat(var(--cols,12),minmax(0,1fr));row-gap:8px;column-gap:2px;align-items:center;font-size:13px}
.k-gantt-h{text-align:center;font-weight:700;color:var(--k-muted);border-bottom:1px solid var(--k-line);padding-bottom:4px}
.k-gantt-label{grid-column:1;font-weight:700;color:var(--k-ink)}
.k-gantt-bar{height:26px;border-radius:13px;background:var(--k-accent);color:#fff;font-weight:700;padding:0 10px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.k-gantt-bar.alt{background:var(--k-accent-2)}.k-gantt-bar.soft{background:var(--k-soft);color:var(--k-accent-dark)}
.k-gantt-bar.milestone{background:transparent;color:var(--k-warn);padding:0}
.k-gantt-bar.milestone::before{content:"◆";margin-right:4px}

/* Process flow (chevrons) */
.k-flow{display:flex;gap:4px;align-items:stretch}
.k-flow-step{flex:1;min-width:0;background:var(--k-soft);padding:12px 18px 12px 26px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);display:flex;flex-direction:column;gap:2px}
.k-flow-step:first-child{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);padding-left:16px}
.k-flow-step.active{background:var(--k-accent);color:#fff}
.k-flow-step b{font-size:15px}.k-flow-step small{font-size:12px;opacity:.85}

/* Progress */
.k-progress{height:9px;background:var(--k-soft);border-radius:5px;overflow:hidden}
.k-progress>i{display:block;height:100%;width:var(--v,0%);background:var(--k-accent);border-radius:5px}

/* Charts inside composed panels */
/* A chart container shrinks to its panel; the SVG scales down (never clips) to fit. */
[data-chart]{display:flex;flex-direction:column;min-height:0;min-width:0}
.scene-body.composed .chart-box{flex:1;min-height:0;box-shadow:none;border:0;padding:0;background:transparent}
.chart-connector{stroke:#9aa392;stroke-width:1.5;stroke-dasharray:4 3}
.wf-total{fill:var(--chart-1)}.wf-up{fill:var(--chart-2)}.wf-down{fill:var(--chart-5)}

/* Dense report parts: matrix (column bands x row labels), band-headed panels, filled row lists, stat strips */
.k-matrix{display:grid;grid-template-columns:var(--head,128px) repeat(var(--cols,4),minmax(0,1fr));grid-template-rows:auto;grid-auto-rows:minmax(0,1fr);gap:8px;flex:1;min-height:0;font-size:15px;line-height:1.45}
.k-mx-col{background:var(--k-ink);color:#fff;border-radius:10px 10px 4px 4px;padding:10px 16px;font-size:17px;font-weight:800}
.k-mx-col small{display:block;font-size:12px;font-weight:700;color:var(--k-warn)}
.k-mx-row{display:grid;place-items:center;text-align:center;background:var(--k-accent-dark);color:#fff;border-radius:10px;padding:8px;font-weight:800}
.k-mx-cell{display:flex;align-items:center;background:var(--k-panel);border:1px solid var(--k-line);border-radius:10px;padding:10px 16px;min-width:0;word-break:keep-all}
.k-mx-cell.hl{background:var(--k-soft);font-weight:800;font-size:16px}
.k-mx-cell.good{color:var(--k-good);font-weight:700;background:color-mix(in srgb,var(--k-good) 9%,#fff)}
.k-band{margin:-18px -20px 2px;padding:10px 20px;background:var(--k-accent-dark);color:#fff;font-size:17px;font-weight:800;text-align:center}
.k-rows{display:flex;flex-direction:column;flex:1;min-height:0;margin:0;padding:0;list-style:none}
.k-rows>*{flex:1;display:flex;align-items:center;gap:10px;border-bottom:1px dashed var(--k-line);padding:6px 2px;word-break:keep-all}
.k-rows>*:last-child{border-bottom:0}
.k-rows b{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.k-stats{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:12px}
.k-stat{display:flex;align-items:center;gap:16px;background:var(--k-soft);border-radius:var(--k-radius);padding:14px 20px;min-width:0}
.k-stat>b{flex:none;font-size:38px;font-weight:800;letter-spacing:-.02em;color:var(--k-accent-dark);font-variant-numeric:tabular-nums}
.k-stat>span{font-size:15px;line-height:1.45;word-break:keep-all}

/* Motion. Entrance classes play when a scene opens (.is-entering) and again when their step becomes current (.focus). */
@keyframes k-in-up{from{opacity:0;transform:translateY(18px)}}
@keyframes k-in-left{from{opacity:0;transform:translateX(-28px)}}
@keyframes k-in-scale{from{opacity:0;transform:scale(.9)}}
@keyframes k-grow-x{from{transform:scaleX(0)}}
@keyframes k-grow-y{from{transform:scaleY(0)}}
@keyframes k-draw{from{stroke-dashoffset:1}}
@keyframes k-pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes k-march{to{stroke-dashoffset:-24}}
@keyframes k-beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.35)}}
.k-in-up{--k-anim:k-in-up}.k-in-left{--k-anim:k-in-left}.k-in-scale{--k-anim:k-in-scale}.k-pop{--k-anim:k-pop}
.k-grow-x{--k-anim:k-grow-x;transform-origin:left center;transform-box:fill-box}
.k-grow-y{--k-anim:k-grow-y;transform-origin:center bottom;transform-box:fill-box}
.k-draw{--k-anim:k-draw;stroke-dasharray:1;stroke-dashoffset:0}
.k-stagger>*{--k-anim:k-in-up}
.k-stagger>:nth-child(2){--k-delay:.08s}.k-stagger>:nth-child(3){--k-delay:.16s}.k-stagger>:nth-child(4){--k-delay:.24s}.k-stagger>:nth-child(5){--k-delay:.32s}.k-stagger>:nth-child(6){--k-delay:.4s}.k-stagger>:nth-child(7){--k-delay:.48s}.k-stagger>:nth-child(n+8){--k-delay:.56s}
.is-entering :is(.k-in-up,.k-in-left,.k-in-scale,.k-grow-x,.k-grow-y,.k-draw,.k-stagger>*),
.reveal-spotlight [data-step].focus :is(.k-in-up,.k-in-left,.k-in-scale,.k-grow-x,.k-grow-y,.k-draw,.k-pop,.k-stagger>*),
.reveal-build [data-step].focus :is(.k-in-up,.k-in-left,.k-in-scale,.k-grow-x,.k-grow-y,.k-draw,.k-pop,.k-stagger>*),
[data-step].focus:is(.k-in-up,.k-in-left,.k-in-scale,.k-pop){animation:var(--k-anim) .7s cubic-bezier(.2,.7,.2,1) var(--k-delay,0s) both}
.k-march{stroke-dasharray:8 4;animation:k-march 1.4s linear infinite}
.k-beat{transform-box:fill-box;transform-origin:center;animation:k-beat 1.8s ease-in-out infinite}
body.motion-none #stage *{animation:none!important}

/* Theme presets. Newly authored tokens; brand colors belong in a deck's own css. */

/* In-browser review: edit and memo modes */
.editor-bar{position:fixed;top:7px;right:14px;z-index:8;display:flex;gap:6px}
.editor-bar button{border:1px solid #c9d1db;background:#fff;color:#1c232c;border-radius:7px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.editor-bar button[aria-pressed=true]{background:#1c232c;color:#fff;border-color:#1c232c}
.editor-bar button:focus-visible{outline:3px solid #355ee8;outline-offset:2px}
body.editing [contenteditable]{outline:2px dashed #3158db;outline-offset:3px;cursor:text;border-radius:2px}
body.editing [contenteditable]:focus{outline-style:solid;background:rgba(49,88,219,.07)}
body.memo-mode #stage,body.memo-mode #stage *{cursor:crosshair}
body.memo-mode #stage :hover{outline:2px solid rgba(226,104,28,.55);outline-offset:2px}
.was-edited{box-shadow:inset 0 -3px 0 rgba(255,193,7,.75)}
.has-memo{position:relative}
.has-memo::after{content:attr(data-memo);position:absolute;top:-12px;right:-12px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#e2681c;color:#fff;font:700 13px/24px "Malgun Gothic",system-ui,sans-serif;text-align:center;z-index:6;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.editor-banner{position:fixed;left:50%;top:54px;transform:translateX(-50%);z-index:20;margin:0;padding:8px 16px;border-radius:8px;background:#fff4e5;border:1px solid #e2a65c;color:#7a3e00;font-size:14px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.editor-banner[hidden]{display:none}
.editor-dialog{width:min(760px,calc(100vw - 32px))}
.memo-target{margin:14px 22px 6px;font-size:13px;color:#5d6876}
.memo-input{display:block;width:calc(100% - 44px);margin:0 22px;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #c9d1db;border-radius:8px;resize:vertical}
.editor-actions{display:flex;gap:10px;padding:14px 22px 18px}
.editor-actions button{border:1px solid #c9d1db;background:#fff;border-radius:8px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer}
.editor-actions button.primary{background:#1c232c;color:#fff;border-color:#1c232c}
.review-list{padding:14px 22px;max-height:460px;overflow:auto;display:grid;gap:10px}
.review-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 12px;border:1px solid #dde3ea;border-radius:8px;background:#fff}
.review-row b{grid-column:1/-1;font-size:13px}
.review-row .before{grid-column:1;font-size:14px;color:#7a8492;text-decoration:line-through}
.review-row .after{grid-column:1;font-size:15px}
.review-row.memo .before{text-decoration:none;font-size:13px}
.review-row.memo .bookmark-jump{grid-column:2;grid-row:2/4;align-self:center}
.review-row.numeric{border-color:#e2a65c;background:#fffaf2}
.review-note{margin:0 22px 18px;font-size:13px;color:#5d6876}
#print-pages .has-memo::after{display:none}
#print-pages .was-edited{box-shadow:none}
@media print{[data-editor-ui],.editor-banner{display:none!important}.has-memo::after{display:none}[contenteditable]{outline:none!important}.was-edited{box-shadow:none}}

(() => {
  'use strict';
  const deck = JSON.parse(document.getElementById('deck-data').textContent);
  const settings = {width:1600,height:900,motion:'key',playback:'manual',font:'system',end:'stop',...deck.settings};
  const english=deck.language==='en';
  const stage = document.getElementById('stage');
  const viewport = document.getElementById('viewport');

  // Resolve player controls once, before any scene content exists, so scene ids can never shadow them.
  const ui = {};

   'bookmark-current','open-bookmarks','bookmarks-dialog','bookmarks-close','bookmarks-list','return-bookmark','return-origin',
   'fullscreen','print','print-confirm','print-close','print-pages','supplements-dialog'].forEach(id=>{ui[id]=document.getElementById(id);});
  const byId = id => ui[id];
  // Card scenes reveal items; composed scenes reveal their named steps.
  const labelsOf = scene => scene.items ? scene.items.map(item => item.label) : scene.steps;
  const plain = value => value.split('**').length%2 ? value.split('**').join('') : value;
  // Backup scenes sit after the main sequence: reachable by chapter tab, contents or data-goto, never by Next.
  const order = deck.scenes.map((_, index) => index).sort((a, b) => Number(Boolean(deck.scenes[a].backup)) - Number(Boolean(deck.scenes[b].backup)) || a - b);
  const steps = order.flatMap(sceneIndex => labelsOf(deck.scenes[sceneIndex]).map((_, itemIndex) => ({sceneIndex, itemIndex})));
  const mainCount = steps.filter(step => !deck.scenes[step.sceneIndex].backup).length;
  const firstStep = id => steps.findIndex(step => deck.scenes[step.sceneIndex].id === id);
  let position = 0, timer = null, playing = false, returnTo = null, shownScene = -1;

  const view = {editing:false, revealAll:false, targets:[], hooks:[]};
  const track = (node, ref, editable) => view.targets.push({node, ref, editable});
  const chapterTabs = [];
  const bookmarks=[];
  const text = (tag, className, value) => {
    const node = document.createElement(tag); node.className = className; node.textContent = value || ''; return node;
  };
  const svgNode = (tag, attrs) => {
    const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value)); return node;
  };
  function fit() {
    const rect = viewport.getBoundingClientRect();
    const scale = Math.min(rect.width/settings.width, rect.height/settings.height);
    stage.style.width = settings.width + 'px'; stage.style.height = settings.height + 'px';
    stage.style.transform = `translate(${(rect.width-settings.width*scale)/2}px,${(rect.height-settings.height*scale)/2}px) scale(${scale})`;
  }
  function diagram(scene, visibleCount) {
    const box = text('div', 'motion-box', '');
    const svg = svgNode('svg', {viewBox:'0 0 600 360',role:'img','aria-label':scene.motion_caption || scene.title});
    const colors = ['#355b37','#3158db','#7f9e53','#b5c886'];
    const count = scene.items.length;
    scene.items.forEach((item, index) => {
      const x = count === 1 ? 300 : 80+index*(440/(count-1));
      const on = index < visibleCount;
      const state = (on?' on':'')+(index===visibleCount-1?' active':'');
      if (scene.motion === 'lines' && index > 0) {
        svg.append(svgNode('path',{d:`M ${x-440/(count-1)+25} 175 H ${x-25}`,stroke:'#3158db','stroke-width':4,fill:'none',class:'motion-link'+state}));
      }
      if (scene.motion === 'planes') {
        svg.append(svgNode('rect',{x:x-50,y:95+index*12,width:100,height:150-index*10,rx:14,fill:colors[index],class:'motion-plane'+state}));
      } else {
        svg.append(svgNode('circle',{cx:x,cy:175,r:scene.motion==='points'?26:20,fill:colors[index],class:'motion-point'+state}));
      }
      const label=svgNode('text',{x,y:285,'text-anchor':'middle',class:'motion-label'});
      label.textContent=item.label; svg.append(label);
    });
    box.append(svg,text('p','motion-caption',scene.motion_caption || '개념 예시 · 실측 수치 아님'));
    return box;
  }
  // Charts are data, not decoration: linear scales from zero, exact labels in
  // text nodes, and full visibility whenever motion is reduced or printed.
  // Show every source decimal (up to 6) so labels stay exact; ticks pass their own precision.
  const decimals = value => Math.min(6,(String(value).split('.')[1]||'').length);
  const numberFormat = (value,digits=decimals(value)) => Number(value).toLocaleString(english?'en-US':'ko-KR',{maximumFractionDigits:digits});
  const percent = value => (Math.round(value*10)/10).toFixed(1)+'%';
  function niceMax(value){

  }
  function svgText(svg, x, y, value, className, anchor='middle'){
    const node=svgNode('text',{x,y,'text-anchor':anchor,class:className}); node.textContent=value; svg.append(node); return node;
  }
  function chart(scene, visibleCount, entering, currentStep=Infinity) {
    const spec=scene.chart, data=spec.data, linked=Boolean(scene.items)&&data.length===scene.items.length;

    const active=index=>stepOf?stepOf(index)===currentStep:linked&&index===visibleCount-1;
    const state=index=>(shown(index)?' on':'')+(active(index)?' active':'');
    const highlight=new Set((spec.highlight||[]).map(value=>typeof value==='number'?value:data.findIndex(item=>item.label===value)));
    const tone=index=>highlight.has(index)?' is-highlight':'';
    const display=item=>item.display || numberFormat(item.value)+(spec.unit||'');
    // Linked charts animate the newly revealed datum; unlinked charts animate once on scene entry.
    const box=text('figure',`chart-box chart-type-${spec.type}${!linked&&entering?' enter':''}`,'');
    if(spec.title) box.append(text('figcaption','chart-title',spec.title));
    const svg=svgNode('svg',{viewBox:'0 0 640 380',role:'group','aria-label':spec.title || scene.title});
    const notes=[];
    if(spec.type==='bar' || spec.type==='line' || spec.type==='waterfall'){
      // Waterfall: totals stand on zero, deltas float from the running total.
      let running=0;
      const spans=data.map((item,index)=>{
        const total=(item.kind || (index===0?'total':'delta'))==='total', from=total?0:running, to=total?item.value:running+item.value;
        running=to; return {from,to,kind:total?'total':item.value>=0?'up':'down'};
      });
      const peak=spec.type==='waterfall'?Math.max(...spans.map(span=>Math.max(span.from,span.to))):Math.max(...data.map(item=>item.value));
      const max=niceMax(peak), left=56, right=616, top=36, bottom=300;
      const y=value=>bottom-(value/max)*(bottom-top), step=(right-left)/data.length;
      for(let tick=0;tick<=4;tick++){
        const value=max*tick/4;
        svg.append(svgNode('path',{d:`M ${left} ${y(value)} H ${right}`,class:'chart-grid'}));
        svgText(svg,left-10,y(value)+5,numberFormat(value,Math.max(0,2-Math.floor(Math.log10(max)))),'chart-axis','end');
      }
      if(spec.type==='line'){
        const points=data.map((item,index)=>[left+step*(index+.5),y(item.value)]);
        svg.append(svgNode('path',{d:`M ${points[0][0]} ${bottom} `+points.map(p=>`L ${p[0]} ${p[1]}`).join(' ')+` L ${points.at(-1)[0]} ${bottom} Z`,class:'chart-area'+(data.every((_,i)=>shown(i))?' on':'')}));
        points.slice(1).forEach((point,index)=>svg.append(svgNode('path',{d:`M ${points[index][0]} ${points[index][1]} L ${point[0]} ${point[1]}`,class:'chart-line'+state(index+1)})));
        points.forEach((point,index)=>svg.append(svgNode('circle',{cx:point[0],cy:point[1],r:9,class:'chart-dot'+state(index)})));
        points.forEach((point,index)=>svgText(svg,point[0],point[1]-20,display(data[index]),'chart-value'+state(index)));
      } else if(spec.type==='waterfall'){
        const width=Math.min(76,step*.6);
        spans.forEach((span,index)=>{
          const x=left+step*(index+.5), high=Math.max(span.from,span.to), item=data[index];
          svg.append(svgNode('rect',{x:x-width/2,y:y(high),width,height:Math.max(Math.abs(y(span.from)-y(span.to)),1),rx:4,style:`--i:${index}`,class:`chart-bar wf-${span.kind}`+state(index)}));
          if(index<spans.length-1) svg.append(svgNode('path',{d:`M ${x+width/2} ${y(span.to)} H ${x+step-width/2}`,class:'chart-connector'+state(index+1)}));
          const label=item.display || (span.kind==='total'?'':item.value>=0?'+':'')+numberFormat(item.value)+(spec.unit||'');
          svgText(svg,x,y(high)-12,label,'chart-value'+state(index));
        });
      } else {
        const width=Math.min(84,step*.62);
        data.forEach((item,index)=>{
          const x=left+step*(index+.5), height=bottom-y(item.value);
          svg.append(svgNode('rect',{x:x-width/2,y:y(item.value),width,height:Math.max(height,0),rx:6,style:`--i:${index}`,class:'chart-bar series-0'+tone(index)+state(index)}));
          svgText(svg,x,y(item.value)-12,display(item),'chart-value'+state(index));
        });
      }
      data.forEach((item,index)=>svgText(svg,left+step*(index+.5),bottom+30,item.label,'chart-label'+state(index)));
      svg.append(svgNode('path',{d:`M ${left} ${bottom} H ${right}`,class:'chart-baseline'}));
    } else if(spec.type==='funnel'){
      const max=Math.max(...data.map(item=>item.value)), rowHeight=Math.min(84,340/data.length), barLeft=150, barWidth=330;
      let clamped=false;
      data.forEach((item,index)=>{
        const top=20+index*rowHeight, exact=max?item.value/max:0, ratio=Math.max(exact,.015);

  const editButton = make('button', 'editor-toggle', t('편집', 'Edit'));
  const memoButton = make('button', 'editor-toggle', t('메모', 'Memo'));
  const reviewButton = make('button', 'editor-review', t('검토', 'Review'));
  for (const button of [editButton, memoButton, reviewButton]) { button.type = 'button'; button.setAttribute('aria-pressed', 'false'); }
  reviewButton.removeAttribute('aria-pressed');
  bar.append(editButton, memoButton, reviewButton);
  const banner = make('p', 'editor-banner');
  banner.setAttribute('role', 'status');
  document.body.append(banner);

  // Memo dialog
  const memoDialog = make('dialog', 'jump-dialog editor-dialog');
  memoDialog.id = 'memo-dialog';
  const memoHeader = make('header'), memoTitle = make('strong', '', t('수정 요청 메모', 'Change request'));
  const memoClose = make('button', '', '×'); memoClose.type = 'button'; memoClose.setAttribute('aria-label', t('닫기', 'Close'));
  memoHeader.append(memoTitle, memoClose);
  const memoTargetText = make('p', 'memo-target');
  const memoInput = make('textarea', 'memo-input');
  memoInput.setAttribute('rows', '4');
  memoInput.setAttribute('placeholder', t('예: 이 문장을 더 짧게, 수치 출처 확인, 차트를 막대로 바꾸기', 'e.g. shorten this, check the source, use a bar chart'));
  const memoActions = make('div', 'editor-actions');
  const memoSave = make('button', 'primary', t('메모 저장', 'Save memo')); memoSave.type = 'button';
  const memoDelete = make('button', '', t('메모 삭제', 'Delete memo')); memoDelete.type = 'button';
  memoActions.append(memoSave, memoDelete);
  memoDialog.append(memoHeader, memoTargetText, memoInput, memoActions);
  document.body.append(memoDialog);

  // Review dialog
  const reviewDialog = make('dialog', 'jump-dialog editor-dialog');
  reviewDialog.id = 'review-dialog';
  const reviewHeader = make('header'), reviewTitle = make('strong', '', t('수정과 메모', 'Edits and memos'));
  const reviewClose = make('button', '', '×'); reviewClose.type = 'button'; reviewClose.setAttribute('aria-label', t('닫기', 'Close'));
  reviewHeader.append(reviewTitle, reviewClose);
  const reviewList = make('div', 'review-list');
  const reviewActions = make('div', 'editor-actions');
  const saveHtmlButton = make('button', 'primary', t('수정본 HTML 저장', 'Save edited HTML')); saveHtmlButton.type = 'button';
  const exportButton = make('button', '', t('수정 내역 내보내기 (JSON)', 'Export changes (JSON)')); exportButton.type = 'button';
  reviewActions.append(saveHtmlButton, exportButton);
  const reviewNote = make('p', 'review-note', t('수정 내역 JSON을 작성자(AI)에게 전달하면 원본에 반영하고 숫자가 바뀐 항목은 다시 검수합니다.', 'Give the JSON to the author (AI) to apply the changes to the source; changed numbers are re-verified.'));
  reviewDialog.append(reviewHeader, reviewList, reviewActions, reviewNote);
  document.body.append(reviewDialog);

  const open = dialog => { api.setPlaying(false); if (typeof dialog.showModal === 'function') dialog.showModal(); else dialog.open = true; };
  const close = dialog => { if (typeof dialog.close === 'function') dialog.close(); else dialog.open = false; };

  function updateCounts() {
    const numeric = review.edits.filter(edit => edit.numeric).length;
    reviewButton.textContent = t('검토', 'Review') + (review.edits.length || review.memos.length ? ` (${review.edits.length + review.memos.length})` : '');
    banner.textContent = numeric ? t(`숫자가 바뀐 수정 ${numeric}건: 차트·합계와 맞는지 작성자 재검수가 필요합니다.`, `${numeric} edit(s) changed numbers: the author must re-verify charts and totals.`) : '';
    banner.hidden = !numeric;
  }

  function snippet(scene, ref) {
    const value = readValue(scene, ref) || '';
    return value.length > 60 ? value.slice(0, 60) + '…' : value;
  }
  function stepLabel() {
    const {sceneIndex, itemIndex} = api.current();
    return api.labelsOf(deck.scenes[sceneIndex])[itemIndex];
  }

  function openMemo(target) {
    const scene = currentScene();
    const existing = review.memos.find(memo => memo.scene === scene.id && memo.key === refKey(target.ref));
    memoTarget = {scene: scene.id, ref: target.ref, key: refKey(target.ref)};
    memoTargetText.textContent = `${scene.id} · ${stepLabel()} · ${snippet(scene, target.ref) || t('(요소)', '(element)')}`;
    memoInput.value = existing ? existing.note : '';
    memoDelete.hidden = !existing;
    open(memoDialog);
    memoInput.focus?.();
  }
  memoSave.addEventListener('click', () => {
    const note = memoInput.value.trim();
    if (!note || !memoTarget) { close(memoDialog); return; }
    const existing = review.memos.find(memo => memo.scene === memoTarget.scene && memo.key === memoTarget.key);
    if (existing) existing.note = note;
    else review.memos.push({...memoTarget, step: stepLabel(), target: snippet(sceneById(memoTarget.scene), memoTarget.ref), note});
    close(memoDialog); updateCounts(); api.render();
  });
  memoDelete.addEventListener('click', () => {
    const index = review.memos.findIndex(memo => memo.scene === memoTarget?.scene && memo.key === memoTarget?.key);
    if (index >= 0) review.memos.splice(index, 1);
    close(memoDialog); updateCounts(); api.render();
  });
  memoClose.addEventListener('click', () => close(memoDialog));
  reviewClose.addEventListener('click', () => close(reviewDialog));

  function renderReview() {
    reviewList.replaceChildren();
    if (!review.edits.length && !review.memos.length) reviewList.append(make('p', 'empty-bookmarks', t('아직 수정이나 메모가 없습니다. 편집(E) 또는 메모(M)를 켜고 화면을 클릭하세요.', 'No edits or memos yet. Turn on Edit (E) or Memo (M) and click the slide.')));
    for (const edit of review.edits) {
      const row = make('div', 'review-row' + (edit.numeric ? ' numeric' : ''));
      row.append(make('b', '', `${t('수정', 'Edit')} · ${edit.scene}${edit.numeric ? t(' · 숫자 변경', ' · number changed') : ''}`), make('span', 'before', edit.before), make('span', 'after', edit.after));
      reviewList.append(row);
    }
    for (const memo of review.memos) {
      const row = make('div', 'review-row memo');
      const jump = make('button', 'bookmark-jump', t('이동', 'Go')); jump.type = 'button';
      jump.addEventListener('click', () => { close(reviewDialog); api.go(api.firstStep(memo.scene)); });
      row.append(make('b', '', `${t('메모', 'Memo')} · ${memo.scene} · ${memo.step}`), make('span', 'after', memo.note), make('span', 'before', memo.target), jump);
      reviewList.append(row);
    }
  }

  function exportReview() {
    return {format: 'ppt-to-html-review', version: 1, deck: deck.title, exported: new Date().toISOString(),
      edits: review.edits.map(({scene, ref, before, after, numeric}) => ({scene, ...ref, before, after, numeric: Boolean(numeric)})),
      memos: review.memos.map(({scene, ref, step, target, note}) => ({scene, ...ref, step, target, note}))};
  }
  const safeJson = value => JSON.stringify(value).replace(/&/g, '\\u0026').replace(/</g, '\\u003c').replace(/>/g, '\\u003e');
  // A copy of this file with the edited deck data; runtime-rendered parts are cleared and rebuilt on open.
  function savedHtml() {
    const copy = document.documentElement.cloneNode(true);
    for (const selector of ['#stage', '#chapter-nav', '#outline-list', '#bookmarks-list', '#position', '#announcement']) copy.querySelector(selector)?.replaceChildren();
    copy.querySelectorAll('[data-editor-ui], #print-pages').forEach(node => node.remove());
    copy.querySelectorAll('dialog[open]').forEach(node => node.removeAttribute('open'));
    const body = copy.querySelector('body');
    body.className = [...document.body.classList].filter(name => name.startsWith('theme-')).join(' ');
    copy.querySelector('#deck-data').textContent = safeJson(deck);
    const head = [...document.childNodes].filter(node => node !== document.documentElement).map(node =>
      node.nodeType === 8 ? `<!--${node.data}-->` : node.nodeType === 10 ? '<!doctype html>' : '').join('\n');
    return head + '\n' + copy.outerHTML;
  }
  function download(name, content, type) {
    const blob = new Blob([content], {type});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob); link.download = name;
    document.body.append(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  }
  const baseName = () => deck.title.replace(/[\\/:*?"<>|]+/g, ' ').trim().slice(0, 60) || 'presentation';
  saveHtmlButton.addEventListener('click', () => download(`${baseName()}-${t('수정본', 'edited')}.html`, savedHtml(), 'text/html'));
  exportButton.addEventListener('click', () => download('deck-edits.json', JSON.stringify(exportReview(), null, 2), 'application/json'));

  function setEditing(on) {
    view.editing = on; view.revealAll = on;
    if (on && memoMode) setMemo(false);
    editButton.setAttribute('aria-pressed', String(on));
    document.body.classList.toggle('editing', on);
    api.setPlaying(false); api.render();
  }
  function setMemo(on) {
    memoMode = on;
    if (on && view.editing) setEditing(false);
    memoButton.setAttribute('aria-pressed', String(on));
    document.body.classList.toggle('memo-mode', on);
    api.setPlaying(false);
  }
  editButton.addEventListener('click', () => setEditing(!view.editing));
  memoButton.addEventListener('click', () => setMemo(!memoMode));
  reviewButton.addEventListener('click', () => { renderReview(); open(reviewDialog); });

  // After each render: make text editable, mark edits and memos.
  view.hooks.push(({scene}) => {
    for (const target of view.targets) {
      const key = refKey(target.ref);
      if (view.editing && target.editable) {
        target.node.setAttribute('contenteditable', 'plaintext-only');
        target.node.setAttribute('spellcheck', 'false');
        target.node.addEventListener('input', () => commit(target, target.node.textContent));
        target.node.addEventListener('keydown', event => { if (event.isComposing || event.keyCode === 229) return; if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); target.node.blur?.(); } });
      }
      if (review.edits.some(edit => edit.scene === scene.id && edit.key === key)) target.node.classList.add('was-edited');
      const memoIndex = review.memos.findIndex(memo => memo.scene === scene.id && memo.key === key);
      if (memoIndex >= 0) { target.node.classList.add('has-memo'); target.node.setAttribute('data-memo', String(memoIndex + 1)); }
    }
  });
  // In memo mode a click on the slide picks the nearest tracked element instead of activating it.
  document.getElementById('stage').addEventListener('click', event => {
    if (!memoMode) return;
    let node = event.target;
    while (node && node.id !== 'stage') {
      const target = view.targets.find(item => item.node === node);
      if (target) { event.preventDefault(); event.stopPropagation(); openMemo(target); return; }
      node = node.parentNode;
    }
  }, true);
  addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || event.target?.closest?.('input,textarea,select,[contenteditable]')) return;
    if (document.body.classList.contains('print-preview') || memoDialog.open || reviewDialog.open || document.querySelector?.('dialog[open]')) return;
    if (event.key.toLowerCase() === 'e') { event.preventDefault(); setEditing(!view.editing); }
    else if (event.key.toLowerCase() === 'm') { event.preventDefault(); setMemo(!memoMode); }
  });
  globalThis.__pptEditor = {exportReview, savedHtml, setEditing, setMemo, review};
  updateCounts();
  api.render();
})();
</script></body></html>
