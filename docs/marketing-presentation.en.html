u003e *').forEach(n=\u003e{if(!n.matches('meta[charset],meta[name=viewport],title,style#analysis-css'))n.remove();});save('campaign-analysis.'+language+'.html','\u003c!doctype html\u003e\\n'+clone.outerHTML,'text/html;charset=utf-8');});\n if(data.savedState){const s=data.savedState;$('week').value=s.week;$('region').value=s.region;document.querySelectorAll('input[name=channel]').forEach(n=\u003en.checked=s.channels.includes(n.value));$('scenario-enabled').checked=Boolean(s.scenario);$('detail-enabled').checked=Boolean(s.detail);for(const k of ['budget','conversion','aov'])$(k).value=s[k];}\n addEventListener('resize',drawTrend);syncBrief();languageUI();render();if(!data.brief)$('setup-dialog').showModal();\n})();\n\u003c/script\u003e\u003c/body\u003e\u003c/html\u003e\n"}, {"id": "guide-en", "label": "User guide (EN)", "html": "\u003c!doctype html\u003e\u003chtml lang=\"en\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\u003ctitle\u003eUser guide · PPT to HTML Agent\u003c/title\u003e\u003cstyle\u003e*{box-sizing:border-box}body{margin:0;background:#f3f5ee;color:#22392e;font:15px/1.85 \"Malgun Gothic\",system-ui,sans-serif}main{max-width:980px;margin:auto;padding:40px 28px}nav{display:flex;gap:16px;flex-wrap:wrap;font-size:12px}a{color:#286449}h1{font-size:38px;line-height:1.25;letter-spacing:-1.5px;margin:22px 0 14px}h2{font-size:23px;margin:36px 0 12px;letter-spacing:-.6px}h3{font-size:16px}p{margin:8px 0}.eyebrow{font-size:10px;letter-spacing:2px;color:#7e9382}.lead{font-size:17px;color:#6a806b;max-width:760px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:25px 0}.step{border-top:2px solid #6c9474;padding-top:12px}.step b{font-size:13px}.step p{font-size:12px;color:#788a76}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e6eee0;padding:20px;border-radius:10px;font:12px/1.9 Consolas,monospace}code{font-family:Consolas,monospace;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #d5dfcf;padding:12px 10px;vertical-align:top}th{color:#6c846b;font-weight:500}.notice{border-left:3px solid #668f72;padding:8px 17px;font-size:13px;background:#eaf0e3}.links{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.links a{background:#fff;border:1px solid #ccd9c6;padding:9px 14px;border-radius:7px;text-decoration:none;font-size:12px}footer{margin-top:40px;border-top:1px solid #d3dfcc;padding-top:20px;font-size:11px;color:#7c8d74}@media(max-width:600px){main{padding:25px 18px}h1{font-size:29px}.steps{grid-template-columns:1fr}th,td{padding:10px 6px;font-size:12px}}\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\u003cmain\u003e\u003cnav\u003e\u003ca href=\"https://github.com/Chris-yoo80/ppt-to-html-agent\"\u003eGitHub ↗\u003c/a\u003e \u003ca href=\"guide.ko.html\"\u003e한국어\u003c/a\u003e\u003c/nav\u003e\u003cp class=\"eyebrow\"\u003ePPT TO HTML AGENT / USER GUIDE\u003c/p\u003e\u003ch1\u003eA presentation, with its supporting analysis.\u003c/h1\u003e\u003cp class=\"lead\"\u003eUse the skill in your AI environment. Keep the presentation concise, then open an additional HTML analysis whenever you need the evidence.\u003c/p\u003e\u003cdiv class=\"links\"\u003e\u003ca href=\"downloads/ppt-to-html.zip\"\u003eDownload skill ZIP\u003c/a\u003e\u003ca href=\"marketing-presentation.en.html\"\u003ePresentation + resources demo\u003c/a\u003e\u003ca href=\"marketing-analysis.en.html\"\u003eStandalone supporting HTML\u003c/a\u003e\u003c/div\u003e\u003csection\u003e\u003ch2\u003e1. Install the skill\u003c/h2\u003e\u003cp\u003eDownload the skill ZIP and copy the complete \u003ccode\u003eppt-to-html/\u003c/code\u003e folder into your working project:\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003cth\u003eHost\u003c/th\u003e\u003cth\u003eProject directory\u003c/th\u003e\u003cth\u003eInvoke\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eClaude Code\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e.claude/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e/ppt-to-html\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCodex\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e.agents/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e$ppt-to-html\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003eOpen that project in the selected host and provide an accessible PPTX. Python 3.10+ is needed for bundled helpers. The website does not upload or convert files. Your AI provider’s subscription or usage charges still apply. Installation links require an internet connection.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e2. Start with the brief\u003c/h2\u003e\u003cpre\u003eUse the ppt-to-html skill to reconstruct this PPT as an HTML presentation.\nAsk only for missing settings: purpose, audience, time, screen size,\ntypeface, motion frequency, playback and supporting material.\nI want marketing analysis as additional HTML inside the presentation.\nPlace controls and slicers on the left, visual results on the right.\nShow the outline and one representative scene before building the rest.\u003c/pre\u003e\u003cp\u003eFor the supporting analysis, first provide the workbook as a chat attachment or accessible local path. The agent asks which sheets/ranges to use and where to place the analysis: Additional resources, a standalone HTML link, or both. Specify the related scene/topic and resource tab label. Then agree on period, currency, KPI definitions, filters, screen, font, language and sharing scope. This is an agent conversation step, not a workbook upload control on this website. The current player uses a presentation-wide resources button; scene-specific controls require a separate extension. Accept recommended defaults in one answer if you prefer. Reuse answers already supplied.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e3. Build the basics, then extend\u003c/h2\u003e\u003cdiv class=\"steps\"\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e01 / Agree\u003c/b\u003e\u003cp\u003eConfirm the brief, source meaning and layout.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e02 / Review\u003c/b\u003e\u003cp\u003eCheck an outline and a representative scene or chart.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e03 / Extend\u003c/b\u003e\u003cp\u003eAdd detail, scenarios and exports after the base is accepted.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003eThe finished deliverables are presentation HTML, supporting-analysis HTML and editable sources. Supporting HTML can be embedded in the presentation, so the main file works offline without a sidecar server.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e4. Present and open additional resources\u003c/h2\u003e\u003ctable\u003e\u003ctr\u003e\u003cth\u003eControl\u003c/th\u003e\u003cth\u003eBehavior\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e← / →\u003c/td\u003e\u003ctd\u003eMove through reveal steps. Home returns to the start.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAutoplay / A\u003c/td\u003e\u003ctd\u003eOptional automatic progression. Stops at the end by default.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAdditional resources\u003c/td\u003e\u003ctd\u003ePauses autoplay and opens supporting HTML over the presentation.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eBack to presentation / Escape\u003c/td\u003e\u003ctd\u003eReturns to the same reveal step. Resume autoplay explicitly.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eResources tabs\u003c/td\u003e\u003ctd\u003eChoose the marketing analysis or this HTML guide.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e5. Explore the marketing supplement\u003c/h2\u003e\u003cp\u003eOn first open, choose purpose, priority metrics, viewing context, font and CSV controls. On the left, select period, channels and market. On the right, review KPIs, revenue/spend trends, conversion counts and channel ROAS. Add the source detail table only when needed.\u003c/p\u003e\u003cp\u003eWhat-if sliders keep source results unchanged. They assume constant cost per click and channel mix, with separate conversion and order-value multipliers. These are hypothetical scenarios, not forecasts. ROAS uses total revenue / total spend; conversion uses total purchases / total clicks. A zero denominator is unavailable.\u003c/p\u003e\u003cp\u003e\u003cb\u003eSave HTML\u003c/b\u003e retains the current brief, filters and assumptions in one file. CSV downloads are opt-in in Initial setup. The source workbook is not automatically attached.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e6. Share the right information\u003c/h2\u003e\u003cdiv class=\"notice\"\u003eOffline HTML contains the data needed for its charts. Turning off CSV buttons does not remove that data or secure confidential information.\u003c/div\u003e\u003cp\u003eReview notes, hidden sheets, embedded files, personal information, internal paths and source attachments before sharing. Include raw PPT or Excel files only when explicitly selected and reviewed. Public examples in this project use newly authored fictional data.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e7. Supported scope\u003c/h2\u003e\u003cp\u003eThe skill redesigns the narrative rather than reproducing PPT pixels. Basic PPTX extraction reads text, tables and separate notes; OCR, SmartArt text and chart workbook interpretation are not included. The campaign starter accepts a reviewed data model; it does not automatically interpret arbitrary Excel formulas, macros or external connections. Other workbook types require a separately validated adapter. MP4 export is deferred.\u003c/p\u003e\u003cp\u003eStatic c HTML을 열어 분석 근거를 확인하세요.\u003c/p\u003e\u003cdiv class=\"links\"\u003e\u003ca href=\"downloads/ppt-to-html.zip\"\u003e스킬 ZIP 내려받기\u003c/a\u003e\u003ca href=\"marketing-presentation.html\"\u003e발표 + 추가 자료 예제\u003c/a\u003e\u003ca href=\"marketing-analysis.html\"\u003e보충 분석 HTML만 열기\u003c/a\u003e\u003c/div\u003e\u003csection\u003e\u003ch2\u003e1. 스킬 설치하기\u003c/h2\u003e\u003cp\u003e스킬 ZIP을 내려받아 \u003ccode\u003eppt-to-html/\u003c/code\u003e 폴더 전체를 작업 프로젝트 안에 넣습니다.\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003cth\u003e도구\u003c/th\u003e\u003cth\u003e프로젝트 안 설치 위치\u003c/th\u003e\u003cth\u003e호출\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eClaude Code\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e.claude/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e/ppt-to-html\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCodex\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e.agents/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e$ppt-to-html\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e해당 프로젝트를 AI 도구에서 열고 접근 가능한 PPTX를 전달합니다. 보조 도구에는 Python 3.10 이상이 필요합니다. 소개 사이트는 파일 업로드·변환 서비스를 제공하지 않습니다. AI 구독료·사용료는 사용하는 서비스의 조건을 따릅니다. 설치 링크는 인터넷 연결이 필요합니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e2. 첫 요청과 기초 설정\u003c/h2\u003e\u003cpre\u003eppt-to-html 스킬로 이 PPT를 HTML 발표로 재구성해줘.\n목적·청중·시간·화면 크기·글꼴·모션 빈도·재생 방식 중\n아직 알려주지 않은 설정만 질문해줘.\n마케팅 분석은 발표 안에서 여는 추가 HTML로 넣어줘.\n왼쪽에는 조정값과 슬라이서, 오른쪽에는 결과와 차트를 배치해줘.\n전체 제작 전에 목차와 대표 화면 하나부터 보여줘.\u003c/pre\u003e\u003cp\u003e보충 분석은 먼저 엑셀을 채팅에 첨부하거나 접근 가능한 로컬 경로로 제공합니다. 에이전트는 사용할 시트·범위와 분석 배치 위치(추가 자료, 별도 HTML 링크, 또는 둘 다), 관련 발표 장면·주제, 자료 탭 이름을 묻습니다. 이후 기간, 통화·단위, 지표 정의, 필터, 화면, 글꼴, 언어, 공유 범위를 정합니다. 이는 에이전트와의 대화 절차이며 이 웹사이트의 엑셀 업로드 기능이 아닙니다. 현재 플레이어는 발표 전체의 추가 자료 버튼을 사용하며, 장면별 버튼은 별도 구현이 필요합니다. “추천 설정으로”라고 한 번에 답해도 됩니다. 이미 전달한 설정은 다시 묻지 않습니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e3. 기초 화면부터 만들고 확장하기\u003c/h2\u003e\u003cdiv class=\"steps\"\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e01 / 설정 합의\u003c/b\u003e\u003cp\u003e목적·원문 의미·기본 배치를 정합니다.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e02 / 대표 화면 검토\u003c/b\u003e\u003cp\u003e목차와 대표 장면 또는 차트 하나를 확인합니다.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e03 / 필요한 기능 추가\u003c/b\u003e\u003cp\u003e기초 화면을 승인한 뒤 상세표·가정·내보내기를 추가합니다.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e결과물은 발표 HTML, 보충 분석 HTML, 편집용 소스입니다. 보충 HTML을 발표 안에 포함할 수 있어, 메인 파일 하나로 서버 없이 오프라인에서 사용할 수 있습니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e4. 발표와 추가 자료 조작\u003c/h2\u003e\u003ctable\u003e\u003ctr\u003e\u003cth\u003e조작\u003c/th\u003e\u003cth\u003e동작\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e← / →\u003c/td\u003e\u003ctd\u003e설명 단계를 이동합니다. Home은 처음으로 돌아갑니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e자동 재생 / A\u003c/td\u003e\u003ctd\u003e선택적으로 자동 진행합니다. 기본은 마지막에 정지입니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e추가 자료\u003c/td\u003e\u003ctd\u003e자동 재생을 멈추고 발표 위에 보충 HTML을 엽니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e발표로 돌아가기 / Escape\u003c/td\u003e\u003ctd\u003e열기 전 발표 단계로 돌아옵니다. 자동 재생은 직접 다시 켭니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e자료 탭\u003c/td\u003e\u003ctd\u003e마케팅 분석과 HTML 설명서를 선택합니다.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e5. 마케팅 분석 화면 사용하기\u003c/h2\u003e\u003cp\u003e처음 열면 분석 목적, 우선 지표, 화면, 글꼴과 CSV 설정을 선택합니다. 왼쪽에서 기간·채널·시장을 고르면 오른쪽 KPI, 매출·광고비 추이, 전환 수치, 채널별 ROAS가 함께 바뀝니다. 원본 상세표는 필요할 때 추가합니다.\u003c/p\u003e\u003cp\u003e가정 시나리오는 원본 성과를 변경하지 않습니다. 클릭당 비용과 채널 비중을 고정한 상태에서 광고비·전환율·객단가 배수를 적용하며, 실제 예측을 뜻하지 않습니다. ROAS는 전체 매출 ÷ 전체 광고비, 전환율은 전체 구매 ÷ 전체 클릭입니다. 분모가 0이면 값을 계산하지 않습니다.\u003c/p\u003e\u003cp\u003e\u003cb\u003eHTML 저장\u003c/b\u003e은 현재 기초 설정·필터·가정을 단일 파일에 보관합니다. CSV는 기초 설정에서 허용한 경우에만 내려받을 수 있습니다. 원본 엑셀 파일은 자동 첨부하지 않습니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e6. 공유 범위 확인하기\u003c/h2\u003e\u003cdiv class=\"notice\"\u003e오프라인 HTML에는 차트를 계산하는 데이터가 포함됩니다. CSV 버튼을 끄는 것으로 데이터가 제거되거나 기밀 자료가 보호되지는 않습니다.\u003c/div\u003e\u003cp\u003e공유 전 발표자 메모, 숨김 시트, 첨부 파일, 개인정보, 내부 경로를 확인합니다. 원본 PPT·엑셀 첨부는 명시적으로 선택하고 검토한 경우에만 포함합니다. 이 프로젝트의 공개 예제는 새로 작성한 가상 자료입니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e7. 지원 범위와 한계\u003c/h2\u003e\u003cp\u003ePPT의 픽셀 배치를 복원하기보다 설명 구조를 재설계합니다. 기본 PPTX 추출기는 텍스트·표·메모를 구분해서 읽으며 OCR, SmartArt 텍스트, 차트 워크북 해석은 지원하지 않습니다. 캠페인 예제는 검토한 데이터 모델을 입력받으며, 임의의 엑셀 수식·매크로·외부 연결을 자동 변환하지 않습니다. 다른 형태의 엑셀에는 별도로 검증한 변환 규칙이 필요합니다. MP4 출력은 후속 기능입니다.\u003c/p\u003e\u003cp\u003e정적 검사, AI 도구 실행 검사, 실제 브라우저 검증은 서로 다른 범위입니다. 구체적인 결과는 검증 기록을 확인하세요. 가상 예제 하나의 통과가 모든 파일·브라우저의 호환성을 보장하지 않습니다.\u003c/p\u003e\u003c/section\u003e\u003cfooter\u003e개인·내부 업무는 무료입니다. 도구 유료 제공·외부 생성 서비스는 별도 서면 허가가 필요합니다.\u003cdetails\u003e\u003csummary\u003e라이선스 전문\u003c/summary\u003e\u003cpre\u003ePPT to HTML Agent Community License 1.0\nInternal Use and Presentation Output Exception\n\nCopyright (c) 2026 Chris-yoo80\n\nThis is a project-specific, source-available license. It is not the MIT\nLicense, an OSI-approved open source license, or n8n\u0026#x27;s license.\n\n1. Scope and ownership\n\nThese terms cover the original skill instructions, helper programs, player\ncode, templates, examples, and documentation distributed with this license\n(the Package). The copyright holder identified above is the Licensor.\nThird-party materials retain their own terms. Your input documents, data,\noriginal presentation content, and independently created assets are not\nclaimed by the Licensor through this license.\n\n2. No-charge permitted use\n\nYou may obtain, run, study, and adapt the Package without paying the\nLicensor for personal purposes, noncommercial activities, and work within\nyour own organization. This includes internal use by a for-profit company\nto prepare its report 03e\u003c/details\u003e\u003cbr\u003eCopyright © 2026 Chris-yoo80 · Community License 1.0\u003c/footer\u003e\u003c/main\u003e\u003c/body\u003e\u003c/html\u003e"}]}</script><script>/* Offline player. Deck content is data, never executable markup. */
(() => {
  'use strict';
  const deck = JSON.parse(document.getElementById('deck-data').textContent);
  const settings = {width:1600,height:900,motion:'key',playback:'manual',font:'system',end:'stop',...deck.settings};
  const english=deck.language==='en';
  const stage = document.getElementById('stage');
  const viewport = document.getElementById('viewport');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const steps = deck.scenes.flatMap((scene, sceneIndex) => scene.items.map((_, itemIndex) => ({sceneIndex, itemIndex})));
  let position = 0, timer = null, playing = false;
  const text = (tag, className, value) => {
    const node = document.createElement(tag); node.className = className; node.textContent = value || ''; return node;
  };
  const svgNode = (tag, attrs) => {
    const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value)); return node;
  };
  function fit() {
    const rect = viewport.getBoundingClientRect();
    const scale = Math.min(rect.width/settings.width, rect.height/settings.height);
    stage.style.width = settings.width + 'px'; stage.style.height = settings.height + 'px';
    stage.style.transform = `translate(${(rect.width-settings.width*scale)/2}px,${(rect.height-settings.height*scale)/2}px) scale(${scale})`;
  }
  function diagram(scene, visibleCount) {
    const box = text('div', 'motion-box', '');
    const svg = svgNode('svg', {viewBox:'0 0 600 360',role:'img','aria-label':scene.motion_caption || scene.title});
    const colors = ['#355b37','#3158db','#7f9e53','#b5c886'];
    const count = scene.items.length;
    scene.items.forEach((item, index) => {
      const x = count === 1 ? 300 : 80+index*(440/(count-1));
      const on = index < visibleCount;
      const state = (on?' on':'')+(index===visibleCount-1?' active':'');
      if (scene.motion === 'lines' && index > 0) {
        svg.append(svgNode('path',{d:`M ${x-440/(count-1)+25} 175 H ${x-25}`,stroke:'#3158db','stroke-width':4,fill:'none',class:'motion-link'+state}));
      }
      if (scene.motion === 'planes') {
        svg.append(svgNode('rect',{x:x-50,y:95+index*12,width:100,height:150-index*10,rx:14,fill:colors[index],class:'motion-plane'+state}));
      } else {
        svg.append(svgNode('circle',{cx:x,cy:175,r:scene.motion==='points'?26:20,fill:colors[index],class:'motion-point'+state}));
      }
      const label=svgNode('text',{x,y:285,'text-anchor':'middle',class:'motion-label'});
      label.textContent=item.label; svg.append(label);
    });
    box.append(svg,text('p','motion-caption',scene.motion_caption || '개념 예시 · 실측 수치 아님'));
    return box;
  }
  function setPlaying(value) {
    clearTimeout(timer); timer=null;
    playing = value && (position < steps.length-1 || settings.end === 'loop');
    const button = document.getElementById('play');
    button.textContent=playing?(english?'Pause':'일시 정지'):(english?'Autoplay':'자동 재생'); button.setAttribute('aria-pressed',String(playing));
    if (playing) timer=setTimeout(next,deck.scenes[steps[position].sceneIndex].duration*1000 || 7000);
  }
  function render() {
    const {sceneIndex,itemIndex}=steps[position], scene=deck.scenes[sceneIndex];
    const motionEnabled = settings.motion!=='none' && scene.motion && scene.motion!=='none';
    stage.replaceChildren(); stage.className=settings.font==='serif'?'serif':'';
    document.body.classList.toggle('motion-none',settings.motion==='none');
    document.body.classList.toggle('motion-rich',settings.motion==='rich');
    const top=text('div','deck-top',''); const mark=text('span','deck-mark','');
    mark.append(document.createElement('i'),document.createTextNode(deck.title));
    top.append(mark,text('span','',`${String(sceneIndex+1).padStart(2,'0')} / ${String(deck.scenes.length).padStart(2,'0')}`));
    stage.append(top,text('p','eyebrow',scene.eyebrow || 'INTERACTIVE PRESENTATION'),text('h1','scene-title',scene.title));
    if(scene.lead) stage.append(text('p','lead',scene.lead));
    const body=text('div',`scene-body ${scene.layout || 'cards'}${motionEnabled?'':' no-motion'}`,'');
    const list=text('div','item-list','');
    scene.items.forEach((item,index)=>{
      const card=text('section','item'+(index<=itemIndex?' on':'')+(index===itemIndex?' active':''),'');
      card.setAttribute('aria-hidden',String(index>itemIndex));
      card.append(text('span','item-index',String(index+1).padStart(2,'0')));
      const content=document.createElement('div');
      if(item.value) content.append(text('strong','item-value',item.value));
      content.append(text('h2','',item.label),text('p','',item.body));card.append(content); list.append(card);
    });
    body.append(list); if(motionEnabled) body.append(diagram(scene,itemIndex+1)); stage.append(body);
    const bottom=text('footer','scene-bottom',''); bottom.append(text('p','message',scene.message),text('p','source',scene.source || ''));
    stage.append(bottom);
    document.getElementById('prev').disabled=position===0;
    document.getElementById('next').disabled=position===steps.length-1 && settings.end==='stop';
    document.getElementById('position').textContent=`${position+1} / ${steps.length} ${english?'steps':'단계'}${position===steps.length-1?(english?' · End':' · 끝'):''}`;
    document.getElementById('announcement').textContent=`${scene.title}. ${scene.items[itemIndex].label}`;
    fit(); setPlaying(playing);
  }
  function go(index){position=Math.max(0,Math.min(steps.length-1,index));render();}
  function next(){if(position<steps.length-1)go(position+1);else if(settings.end==='loop')go(0);else setPlaying(false);}
  document.getElementById('prev').addEventListener('click',()=>go(position-1));
  document.getElementById('next').addEventListener('click',next);
  document.getElementById('play').addEventListener('click',()=>setPlaying(!playing));
  document.getElementById('play').hidden=settings.playback==='manual';
  document.getElementById('replay').addEventListener('click',()=>{setPlaying(false);go(0);});
  document.getElementById('fullscreen').addEventListener('click',async()=>{
    try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}
    catch{document.getElementById('announcement').textContent='이 환경에서는 전체 화면을 사용할 수 없습니다.';}
  });
  addEventListener('keydown',event=>{
    if(document.getElementById('supplements-dialog')?.open)return;
    if(event.altKey||event.ctrlKey||event.metaKey||event.target.closest('input,textarea,select,[contenteditable=true]'))return;
    // Arrow navigation still works after clicking a control. Space/Enter keep
    // their native button/link activation instead of triggering two actions.
    if(event.target.closest('button,a')&&[' ','Enter'].includes(event.key))return;
    if(['ArrowRight','PageDown',' '].includes(event.key)){event.preventDefault();next();}
    else if(['ArrowLeft','PageUp'].includes(event.key)){event.preventDefault();go(position-1);}
    else if(event.key==='Home'){event.preventDefault();go(0);}
    else if(event.key==='End'){event.preventDefault();go(steps.length-1);}
    else if(event.key.toLowerCase()==='a'&&settings.playback!=='manual')setPlaying(!playing);
    else if(event.key==='Escape')setPlaying(false);
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden)setPlaying(false);});
  addEventListener('ppt-open-supplement',()=>setPlaying(false));
  addEventListener('resize',fit); reduced.addEventListener('change',render);
  render(); if(settings.playback==='auto')setPlaying(true);
})();

/* Supporting HTML runs in a sandboxed dialog; the presentation keeps its step. */
(()=>{
 const deck=JSON.parse(document.getElementById('deck-data').textContent),dialog=document.getElementById('supplements-dialog'),frames=[document.getElementById('supplement-frame')];let selected=0;
 function select(index){selected=index;const item=deck.supplements[index];if(!frames[index]){const frame=document.createElement('iframe');frame.id='supplement-resource-'+index;frame.setAttribute('sandbox','allow-scripts allow-downloads allow-forms');dialog.append(frame);frames[index]=frame;}const frame=frames[index];frame.className='supplement-resource';if(!frame.srcdoc)frame.srcdoc=item.html;frame.title=item.label;frames.forEach((n,i)=>n.hidden=i!==index);document.querySelectorAll('#supplement-tabs button').forEach((n,i)=>n.setAttribute('aria-pressed',String(i===index)));}
 deck.supplements.forEach((item,index)=>{const button=document.createElement('button');button.type='button';button.textContent=item.label;button.addEventListener('click',()=>select(index));document.getElementById('supplement-tabs').append(button);});
 document.getElementById('open-supplements').addEventListener('click',()=>{dispatchEvent(new Event('ppt-open-supplement'));select(selected);dialog.showModal();});
 document.getElementById('close-supplements').addEventListener('click',()=>dialog.close());
 dialog.addEventListener('close',()=>{document.getElementById('open-supplements').focus();});
})();
</script></body></html>
