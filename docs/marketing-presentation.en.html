budget','conversion','aov'])$(k).value=s[k];}\n addEventListener('resize',drawTrend);syncBrief();languageUI();render();if(!data.brief)$('setup-dialog').showModal();\n})();\n\u003c/script\u003e\u003c/body\u003e\u003c/html\u003e\n"}, {"id": "guide-en", "label": "User guide (EN)", "html": "\u003c!doctype html\u003e\u003chtml lang=\"en\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\u003ctitle\u003eUser guide · PPT to HTML Agent\u003c/title\u003e\u003cstyle\u003e*{box-sizing:border-box}body{margin:0;background:#f3f5ee;color:#22392e;font:15px/1.85 \"Malgun Gothic\",system-ui,sans-serif}main{max-width:980px;margin:auto;padding:40px 28px}nav{display:flex;gap:16px;flex-wrap:wrap;font-size:12px}a{color:#286449}h1{font-size:38px;line-height:1.25;letter-spacing:-1.5px;margin:22px 0 14px}h2{font-size:23px;margin:36px 0 12px;letter-spacing:-.6px}h3{font-size:16px}p{margin:8px 0}.eyebrow{font-size:10px;letter-spacing:2px;color:#7e9382}.lead{font-size:17px;color:#6a806b;max-width:760px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:25px 0}.step{border-top:2px solid #6c9474;padding-top:12px}.step b{font-size:13px}.step p{font-size:12px;color:#788a76}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e6eee0;padding:20px;border-radius:10px;font:12px/1.9 Consolas,monospace}code{font-family:Consolas,monospace;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #d5dfcf;padding:12px 10px;vertical-align:top}th{color:#6c846b;font-weight:500}.notice{border-left:3px solid #668f72;padding:8px 17px;font-size:13px;background:#eaf0e3}.links{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.links a{background:#fff;border:1px solid #ccd9c6;padding:9px 14px;border-radius:7px;text-decoration:none;font-size:12px}footer{margin-top:40px;border-top:1px solid #d3dfcc;padding-top:20px;font-size:11px;color:#7c8d74}@media(max-width:600px){main{padding:25px 18px}h1{font-size:29px}.steps{grid-template-columns:1fr}th,td{padding:10px 6px;font-size:12px}}\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\u003cmain\u003e\u003cnav\u003e\u003ca href=\"https://github.com/Chris-yoo80/ppt-to-html-agent\"\u003eGitHub ↗\u003c/a\u003e \u003ca href=\"guide.ko.html\"\u003e한국어\u003c/a\u003e\u003c/nav\u003e\u003cp class=\"eyebrow\"\u003ePPT TO HTML AGENT / USER GUIDE\u003c/p\u003e\u003ch1\u003eA presentation, with its supporting analysis.\u003c/h1\u003e\u003cp class=\"lead\"\u003eUse the skill in your AI environment. Keep the presentation concise, then open an additional HTML analysis whenever you need the evidence.\u003c/p\u003e\u003cdiv class=\"links\"\u003e\u003ca href=\"https://chris-yoo80.github.io/ppt-to-html-agent/downloads/ppt-to-html.zip\"\u003eDownload skill ZIP\u003c/a\u003e\u003ca href=\"https://chris-yoo80.github.io/ppt-to-html-agent/marketing-presentation.en.html\"\u003ePresentation + resources demo\u003c/a\u003e\u003ca href=\"https://chris-yoo80.github.io/ppt-to-html-agent/marketing-analysis.en.html\"\u003eStandalone supporting HTML\u003c/a\u003e\u003c/div\u003e\u003csection id=\"install\"\u003e\u003ch2\u003e1. Install the skill\u003c/h2\u003e\u003cp\u003eBefore you start: Claude Code or Codex must be installed and signed in, and Python 3.10+ is needed for bundled helpers. Check with \u003ccode\u003epython --version\u003c/code\u003e on Windows or \u003ccode\u003epython3 --version\u003c/code\u003e on macOS/Linux; macOS/Linux users type \u003ccode\u003epython3\u003c/code\u003e wherever examples say \u003ccode\u003epython\u003c/code\u003e.\u003c/p\u003e\u003cp\u003e\u003cb\u003eEasiest:\u003c/b\u003e unpack the ZIP, open your project folder in Claude Code or Codex, and ask the agent to install it:\u003c/p\u003e\u003cpre\u003eInstall the ppt-to-html folder from my Downloads folder as a Claude Code skill for this project.\nThe result must be .claude/skills/ppt-to-html/SKILL.md, not one folder deeper.\nThen check the path and tell me how to invoke the skill.\u003c/pre\u003e\u003cp\u003eFor Codex, say “Codex skill” and \u003ccode\u003e.agents/skills/ppt-to-html/SKILL.md\u003c/code\u003e. To copy the folder yourself, put the complete \u003ccode\u003eppt-to-html/\u003c/code\u003e folder in one of these locations:\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003cth\u003eHost\u003c/th\u003e\u003cth\u003eOne project (inside your project folder)\u003c/th\u003e\u003cth\u003eEvery project (user folder)\u003c/th\u003e\u003cth\u003eInvoke\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eClaude Code\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e.claude/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e~/.claude/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e/ppt-to-html\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCodex\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e.agents/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e~/.agents/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e$ppt-to-html\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cdiv class=\"notice\"\u003eThe result must be \u003ccode\u003eskills/ppt-to-html/SKILL.md\u003c/code\u003e, not one folder deeper. Windows “Extract All” adds a folder named after the ZIP; extract to the \u003ccode\u003eskills\u003c/code\u003e folder itself or move the inner \u003ccode\u003eppt-to-html\u003c/code\u003e folder up one level.\u003c/div\u003e\u003cp\u003eFolders starting with a dot are hidden: on Windows use File Explorer → View → Show → Hidden items; on macOS press \u003ccode\u003eCmd+Shift+.\u003c/code\u003e in Finder. \u003ccode\u003e~\u003c/code\u003e is your user folder, such as \u003ccode\u003eC:\\Users\\name\u003c/code\u003e or \u003ccode\u003e/Users/name\u003c/code\u003e.\u003c/p\u003e\u003cp\u003eOpen your project folder in the host (restart it if it was running). Type \u003ccode\u003e/\u003c/code\u003e in Claude Code or \u003ccode\u003e$\u003c/code\u003e in Codex and check that \u003ccode\u003eppt-to-html\u003c/code\u003e appears. To update, delete the old folder and install the new one. The website does not upload or convert files. Your AI provider’s subscription or usage charges still apply.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e2. Start with the brief\u003c/h2\u003e\u003cpre\u003eUse the ppt-to-html skill to reconstruct this PPT as an HTML presentation.\nAsk only for missing settings: purpose, audience, time, screen size,\ntypeface, motion frequency, playback and supporting material.\nI want marketing analysis as additional HTML inside the presentation.\nPlace controls and slicers on the left, visual results on the right.\nShow the outline and one representative scene before building the rest.\u003c/pre\u003e\u003cp\u003eFor the supporting analysis, first provide the workbook as a chat attachment or accessible local path. The agent asks which sheets/ranges to use and where to place the analysis: Additional resources, a standalone HTML link, or both. Specify the related scene/topic and resource tab label. Then agree on period, currency, KPI definitions, filters, screen, font, language and sharing scope. This is an agent conversation step, not a workbook upload control on this website. The current player uses a presentation-wide resources button; scene-specific controls require a separate extension. Accept recommended defaults in one answer if you prefer. Reuse answers already supplied.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e3. Build the basics, then extend\u003c/h2\u003e\u003cdiv class=\"steps\"\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e01 / Agree\u003c/b\u003e\u003cp\u003eConfirm the brief, source meaning and layout.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e02 / Review\u003c/b\u003e\u003cp\u003eCheck an outline and a representative scene or chart.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e03 / Extend\u003c/b\u003e\u003cp\u003eAdd detail, scenarios and exports after the base is accepted.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003eThe finished deliverables are presentation HTML, supporting-analysis HTML and editable sources. Supporting HTML can be embedded in the presentation, so the main file works offline without a sidecar server.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e4. Present and open additional resources\u003c/h2\u003e\u003ctable\u003e\u003ctr\u003e\u003cth\u003eControl\u003c/th\u003e\u003cth\u003eBehavior\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e← / →\u003c/td\u003e\u003ctd\u003eMove through reveal steps. Home returns to the start.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eContents / G\u003c/td\u003e\u003ctd\u003eOpen every scene and reveal step, then jump directly to one.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMark question / B\u003c/td\u003e\u003ctd\u003eSave the current scene and exact reveal step. Shift+B opens all marks.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eReturn to question / R\u003c/td\u003e\u003ctd\u003eReturn to the latest mark. Choose an earlier mark from Question list.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAutoplay / A\u003c/td\u003e\u003ctd\u003eOptional automatic progression. Stops at the end by default.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAdditional resources\u003c/td\u003e\u003ctd\u003ePauses autoplay and opens supporting HTML over the presentation. The step and question marks remain in the same session.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eBack to presentation / Escape\u003c/td\u003e\u003ctd\u003eReturns to the same reveal step. Resume autoplay explicitly.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eResources tabs\u003c/td\u003e\u003ctd\u003eChoose the marketing analysis or this HTML guide.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e5. Explore the marketing supplement\u003c/h2\u003e\u003cp\u003eOn first open, choose purpose, priority metrics, viewing context, font and CSV controls. On the left, select period, channels and market. On the right, review KPIs, revenue/spend trends, conversion counts and channel ROAS. Add the source detail table only when needed.\u003c/p\u003e\u003cp\u003eWhat-if sliders keep source results unchanged. They assume constant cost per click and channel mix, with separate conversion and order-value multipliers. These are hypothetical scenarios, not forecasts. ROAS uses total revenue / total spend; conversion uses total purchases / total clicks. A zero denominator is unavailable.\u003c/p\u003e\u003cp\u003e\u003cb\u003eSave HTML\u003c/b\u003e retains the current brief, filters and assumptions in one file. CSV downloads are opt-in in Initial setup. The source workbook is not automatically attached.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e6. Share the right information\u003c/h2\u003e\u003cdiv class=\"notice\"\u003eOffline HTML contains the data needed for its charts. Turning off CSV buttons does not remove that data or secure confidential information.\u003c/div\u003e\u003cp\u003eReview notes, hidden sheets, embedded files, personal information, internal paths and source attachments before sharing. Include raw PPT or Excel files only when explicitly selected and reviewed. Public examples in this project use newly authored fictional data.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e7. PDF output and backup tabs\u003c/h2\u003e\u003cp\u003eAt the start, tell the agent whether you need a deck PDF, analysis PDF, or both. Specify backup files, their related scene/topic, tab labels and placement (Additional resources, a separate HTML link, or both). The agent asks for missing answers and reuses known settings. Raw PPT/Excel attachments remain a separate opt-in choice.\u003c/p\u003e\u003cp\u003eIn the presentation, choose \u003cb\u003ePrint / PDF\u003c/b\u003e to preview all scenes with every reveal visible, one scene per A4 landscape page. Choose \u003cb\u003ePrint / Save as PDF\u003c/b\u003e, select the browser's PDF destination, and save. Return to the same presentation step; autoplay remains paused. Browser headers/footers can be disabled in the print dialog.\u003c/p\u003e\u003cp\u003ePrint supporting analysis separately using its \u003cb\u003ePrint / PDF\u003c/b\u003e control, or open its standalone HTML. It uses the current filters and enabled detail/scenario sections. Motion and slicers become static results. Backup resources are labeled HTML tabs (up to eight); the example includes source/calculation notes. They are not automatically merged into the deck PDF. Review each resource's own print layout before sharing.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e8. Verify the numbers\u003c/h2\u003e\u003cp\u003eBefore delivery, compare units and any displayed conversion, denominators, filters/ranges, rounding and source references against the original workbook. Unit review includes length, area, volume, mass, time, speed, energy/power and compound/business units, not just money. The bundled unit_audit.py checks declared conversions such as m/mm, m²/cm², L/m³, kg/t, km/h→m/s, item/h and KRW/kg. Box/item conversions need a positive per-source-unit factor and its definition source. Unknown units, incompatible dimensions, Celsius/Fahrenheit offsets, exchange rates and calendar months remain Needs review. A passed arithmetic comparison is not an automatic workbook audit; campaign charts remain KRW-based. In \u003cb\u003eDefinitions and evidence\u003c/b\u003e, inspect source units, conversion precision, rate definitions, current filters, source totals and sheet/range. Amounts are sourced in KRW; Korean views abbreviate amounts of at least KRW 10,000 in units of 10,000 (max one decimal), English views abbreviate amounts of at least KRW 1,000,000 in millions (max two decimals). Trend axes use those divisors with max one decimal; rates use max two decimals. Ratios use the same selected group, not an average of row ratios.\u003c/p\u003e\u003cp\u003eThe agent's final report must include six rows: \u003cb\u003eunits / denominators / filters and ranges / rounding / motion-off and print retention / provenance\u003c/b\u003e, each with \u003cb\u003ePassed or Needs review\u003c/b\u003e and supporting evidence. Metadata describes the implementation; it does not automatically certify agreement with your workbook. Rounded parts may differ from the rounded total; calculations retain source precision. Missing source definitions or checks remain Needs review.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e9. Read without motion\u003c/h2\u003e\u003cp\u003eThe motion demos keep a static \u003cb\u003eKey facts\u003c/b\u003e summary below the player: title, explanation, all four phases, figures and qualifications. Earlier headline figures remain available at the final frame. Use \u003cb\u003eTurn motion off\u003c/b\u003e to stop animation and keep manual chapter/timeline navigation. System reduced motion takes precedence. Switching it on pauses at the current time; turning it off does not resume playback automatically.\u003c/p\u003e\u003cp\u003eIn the presentation, reduced motion or motion=none reveals all items in the current scene while retaining its navigation step. Autoplay is disabled under system reduced motion. The demo's \u003cb\u003ePrint / PDF\u003c/b\u003e previews all three summaries. The presentation previews every scene, including staged content. Return to the same story/time or presentation step, with playback paused. Saved-PDF verification is separate.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e10. Supported scope\u003c/h2\u003e\u003cp\u003eThe skill redesigns the narrative rather than reproducing PPT pixels. Basic PPTX extraction reads text, tables and separate notes; OCR, SmartArt text and chart workbook interpretation are not included. The campaign starter accepts a reviewed data model; it does not automatically interpret arbitrary Excel formulas, macros or external connections. Other workbook types require a separately validated adapter. MP4 export is deferred.\u003c/p\u003e\u003cp\u003eStatic checks, host CLI tests and real browser checks cover different things. See the verification record for the exact observations; a single fictional example does not establish compatibility with every workbook or browser.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e11. Use a design reference\u003c/h2\u003e\u003cp\u003eProvide a website URL, GitHub repository, local HTML/image, named style or one of four presets: \u003ccode\u003eslide-story\u003c/code\u003e, \u003ccode\u003edashboard\u003c/code\u003e, \u003ccode\u003edata-motion\u003c/code\u003e and \u003ccode\u003ehybrid\u003c/code\u003e. State whether to apply mood, color, typography, layout, cards, charts, motion, navigation or selected scenes.\u003c/p\u003e\u003cp\u003eThe default is visual inspiration. The agent extracts abstract rules and rebuilds them with project-owned HTML/CSS/SVG; it does not copy branding, text, images, icons, sample data, DOM or CSS. Code or asset reuse requires a verified license and source URL. The output stays an offline single HTML file and records decisions in \u003ccode\u003edesign-reference.json\u003c/code\u003e.\u003c/p\u003e\u003c/section\u003e\u003cfooter\u003ePersonal/internal use is free. Paid redistribution of the tool or external generation services require separate written permission.\u003cdetails\u003e\u003csummary\u003eComplete license\u003c/summary\u003e\u003cpre\u003ePPT to HTML Agent Community License 1.0\nInternal Use and Presentation Output Exception\n\nCopyright (c) 2026 Chris-yoo80 .step b{font-size:13px}.step p{font-size:12px;color:#788a76}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e6eee0;padding:20px;border-radius:10px;font:12px/1.9 Consolas,monospace}code{font-family:Consolas,monospace;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #d5dfcf;padding:12px 10px;vertical-align:top}th{color:#6c846b;font-weight:500}.notice{border-left:3px solid #668f72;padding:8px 17px;font-size:13px;background:#eaf0e3}.links{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.links a{background:#fff;border:1px solid #ccd9c6;padding:9px 14px;border-radius:7px;text-decoration:none;font-size:12px}footer{margin-top:40px;border-top:1px solid #d3dfcc;padding-top:20px;font-size:11px;color:#7c8d74}@media(max-width:600px){main{padding:25px 18px}h1{font-size:29px}.steps{grid-template-columns:1fr}th,td{padding:10px 6px;font-size:12px}}\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\u003cmain\u003e\u003cnav\u003e\u003ca href=\"https://github.com/Chris-yoo80/ppt-to-html-agent\"\u003eGitHub ↗\u003c/a\u003e \u003ca href=\"guide.en.html\"\u003eEnglish\u003c/a\u003e\u003c/nav\u003e\u003cp class=\"eyebrow\"\u003ePPT TO HTML AGENT / USER GUIDE\u003c/p\u003e\u003ch1\u003e발표에 근거 자료까지,\u003cbr\u003eHTML로 함께.\u003c/h1\u003e\u003cp class=\"lead\"\u003e스킬은 AI 작업 환경에서 사용합니다. 발표는 간결하게 이어가고, 필요한 순간 추가 HTML을 열어 분석 근거를 확인하세요.\u003c/p\u003e\u003cdiv class=\"links\"\u003e\u003ca href=\"https://chris-yoo80.github.io/ppt-to-html-agent/downloads/ppt-to-html.zip\"\u003e스킬 ZIP 내려받기\u003c/a\u003e\u003ca href=\"https://chris-yoo80.github.io/ppt-to-html-agent/marketing-presentation.html\"\u003e발표 + 추가 자료 예제\u003c/a\u003e\u003ca href=\"https://chris-yoo80.github.io/ppt-to-html-agent/marketing-analysis.html\"\u003e보충 분석 HTML만 열기\u003c/a\u003e\u003c/div\u003e\u003csection id=\"install\"\u003e\u003ch2\u003e1. 스킬 설치하기\u003c/h2\u003e\u003cp\u003e시작 전에 Claude Code 또는 Codex가 설치·로그인되어 있어야 하고, 보조 도구에는 Python 3.10 이상이 필요합니다. Windows는 \u003ccode\u003epython --version\u003c/code\u003e, macOS·리눅스는 \u003ccode\u003epython3 --version\u003c/code\u003e으로 확인합니다. macOS·리눅스에서는 예시의 \u003ccode\u003epython\u003c/code\u003e을 \u003ccode\u003epython3\u003c/code\u003e으로 바꿔 입력하세요.\u003c/p\u003e\u003cp\u003e\u003cb\u003e가장 쉬운 방법:\u003c/b\u003e ZIP을 풀고 Claude Code나 Codex에서 내 프로젝트 폴더를 연 뒤 설치를 요청합니다.\u003c/p\u003e\u003cpre\u003e다운로드 폴더의 ppt-to-html 폴더를 이 프로젝트의 Claude Code 스킬로 설치해줘.\n최종 위치가 .claude/skills/ppt-to-html/SKILL.md가 되게 하고, 한 단계 더 깊으면 안 돼.\n설치 후 경로를 확인하고 스킬 호출 방법을 알려줘.\u003c/pre\u003e\u003cp\u003eCodex는 “Codex 스킬”과 \u003ccode\u003e.agents/skills/ppt-to-html/SKILL.md\u003c/code\u003e로 바꿔 요청합니다. 직접 넣으려면 \u003ccode\u003eppt-to-html/\u003c/code\u003e 폴더 전체를 아래 위치 중 하나에 넣습니다.\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003cth\u003e도구\u003c/th\u003e\u003cth\u003e이 프로젝트에서만 (프로젝트 폴더 안)\u003c/th\u003e\u003cth\u003e모든 프로젝트에서 (사용자 폴더)\u003c/th\u003e\u003cth\u003e호출\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eClaude Code\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e.claude/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e~/.claude/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e/ppt-to-html\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCodex\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e.agents/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e~/.agents/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e$ppt-to-html\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cdiv class=\"notice\"\u003e최종 위치는 \u003ccode\u003eskills/ppt-to-html/SKILL.md\u003c/code\u003e여야 하며 한 단계 더 깊으면 인식되지 않습니다. Windows의 “압축 풀기”는 ZIP 이름의 폴더를 하나 더 만듭니다. \u003ccode\u003eskills\u003c/code\u003e 폴더 자체에 풀거나, 푼 뒤 안쪽 \u003ccode\u003eppt-to-html\u003c/code\u003e 폴더를 한 단계 위로 옮기세요.\u003c/div\u003e\u003cp\u003e점(.)으로 시작하는 폴더는 숨겨져 있습니다. Windows는 파일 탐색기 → 보기 → 표시 → 숨긴 항목, macOS는 Finder에서 \u003ccode\u003eCmd+Shift+.\u003c/code\u003e을 누르세요. \u003ccode\u003e~\u003c/code\u003e는 \u003ccode\u003eC:\\Users\\이름\u003c/code\u003e, \u003ccode\u003e/Users/이름\u003c/code\u003e 같은 사용자 폴더입니다.\u003c/p\u003e\u003cp\u003eAI 도구에서 프로젝트 폴더를 엽니다(실행 중이었다면 다시 시작). Claude Code는 \u003ccode\u003e/\u003c/code\u003e, Codex는 \u003ccode\u003e$\u003c/code\u003e를 입력해 \u003ccode\u003eppt-to-html\u003c/code\u003e이 보이는지 확인합니다. 업데이트할 때는 기존 폴더를 지우고 새로 넣습니다. 소개 사이트는 파일 업로드·변환 서비스를 제공하지 않습니다. AI 구독료·사용료는 사용하는 서비스의 조건을 따릅니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e2. 첫 요청과 기초 설정\u003c/h2\u003e\u003cpre\u003eppt-to-html 스킬로 이 PPT를 HTML 발표로 재구성해줘.\n목적·청중·시간·화면 크기·글꼴·모션 빈도·재생 방식 중\n아직 알려주지 않은 설정만 질문해줘.\n마케팅 분석은 발표 안에서 여는 추가 HTML로 넣어줘.\n왼쪽에는 조정값과 슬라이서, 오른쪽에는 결과와 차트를 배치해줘.\n전체 제작 전에 목차와 대표 화면 하나부터 보여줘.\u003c/pre\u003e\u003cp\u003e보충 분석은 먼저 엑셀을 채팅에 첨부하거나 접근 가능한 로컬 경로로 제공합니다. 에이전트는 사용할 시트·범위와 분석 배치 위치(추가 자료, 별도 HTML 링크, 또는 둘 다), 관련 발표 장면·주제, 자료 탭 이름을 묻습니다. 이후 기간, 통화·단위, 지표 정의, 필터, 화면, 글꼴, 언어, 공유 범위를 정합니다. 이는 에이전트와의 대화 절차이며 이 웹사이트의 엑셀 업로드 기능이 아닙니다. 현재 플레이어는 발표 전체의 추가 자료 버튼을 사용하며, 장면별 버튼은 별도 구현이 필요합니다. “추천 설정으로”라고 한 번에 답해도 됩니다. 이미 전달한 설정은 다시 묻지 않습니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e3. 기초 화면부터 만들고 확장하기\u003c/h2\u003e\u003cdiv class=\"steps\"\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e01 / 설정 합의\u003c/b\u003e\u003cp\u003e목적·원문 의미·기본 배치를 정합니다.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e02 / 대표 화면 검토\u003c/b\u003e\u003cp\u003e목차와 대표 장면 또는 차트 하나를 확인합니다.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e03 / 필요한 기능 추가\u003c/b\u003e\u003cp\u003e기초 화면을 승인한 뒤 상세표·가정·내보내기를 추가합니다.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e결과물은 발표 HTML, 보충 분석 HTML, 편집용 소스입니다. 보충 HTML을 발표 안에 포함할 수 있어, 메인 파일 하나로 서버 없이 오프라인에서 사용할 수 있습니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e4. 발표와 추가 자료 조작\u003c/h2\u003e\u003ctable\u003e\u003ctr\u003e\u003cth\u003e조작\u003c/th\u003e\u003cth\u003e동작\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e← / →\u003c/td\u003e\u003ctd\u003e설명 단계를 이동합니다. Home은 처음으로 돌아갑니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e목차 / G\u003c/td\u003e\u003ctd\u003e모든 장면과 설명 단계를 열고 원하는 위치로 바로 이동합니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e질문 표시 / B\u003c/td\u003e\u003ctd\u003e현재 장면과 정확한 설명 단계를 저장합니다. Shift+B는 전체 질문 표시를 엽니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e질문 복귀 / R\u003c/td\u003e\u003ctd\u003e가장 최근 표시로 돌아갑니다. 이전 표시는 질문 목록에서 선택합니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e자동 재생 / A\u003c/td\u003e\u003ctd\u003e선택적으로 자동 진행합니다. 기본은 마지막에 정지입니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e추가 자료\u003c/td\u003e\u003ctd\u003e자동 재생을 멈추고 발표 위에 보충 HTML을 엽니다. 같은 세션의 발표 위치와 질문 표시는 유지됩니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e발표로 돌아가기 / Escape\u003c/td\u003e\u003ctd\u003e열기 전 발표 단계로 돌아옵니다. 자동 재생은 직접 다시 켭니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e자료 탭\u003c/td\u003e\u003ctd\u003e마케팅 분석과 HTML 설명서를 선택합니다.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e5. 마케팅 분석 화면 사용하기\u003c/h2\u003e\u003cp\u003e처음 열면 분석 목적, 우선 지표, 화면, 글꼴과 CSV 설정을 선택합니다. 왼쪽에서 기간·채널·시장을 고르면 오른쪽 KPI, 매출·광고비 추이, 전환 수치, 채널별 ROAS가 함께 바뀝니다. 원본 상세표는 필요할 때 추가합니다.\u003c/p\u003e\u003cp\u003e가정 시나리오는 원본 성과를 변경하지 않습니다. 클릭당 비용과 채널 비중을 고정한 상태에서 광고비·전환율·객단가 배수를 적용하며, 실제 예측을 뜻하지 않습니다. ROAS는 전체 매출 ÷ 전체 광고비, 전환율은 전체 구매 ÷ 전체 클릭입니다. 분모가 0이면 값을 계산하지 않습니다.\u003c/p\u003e\u003cp\u003e\u003cb\u003eHTML 저장\u003c/b\u003e은 현재 기초 설정·필터·가정을 단일 파일에 보관합니다. CSV는 기초 설정에서 허용한 경우에만 내려받을 수 있습니다. 원본 엑셀 파일은 자동 첨부하지 않습니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e6. 공유 범위 확인하기\u003c/h2\u003e\u003cdiv class=\"notice\"\u003e오프라인 HTML에는 차트를 계산하는 데이터가 포함됩니다. CSV 버튼을 끄는 것으로 데이터가 제거되거나 기밀 자료가 보호되지는 않습니다.\u003c/div\u003e\u003cp\u003e공유 전 발표자 메모, 숨김 시트, 첨부 파일, 개인정보, 내부 경로를 확인합니다. 원본 PPT·엑셀 첨부는 명시적으로 선택하고 검토한 경우에만 포함합니다. 이 프로젝트의 공개 예제는 새로 작성한 가상 자료입니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e7. PDF 출력과 백업자료 탭\u003c/h2\u003e\u003cp\u003e처음에 발표 PDF·분석 PDF 중 필요한 범위와 백업자료 파일, 관련 장면·주제, 탭 이름, 배치 위치(추가 자료·별도 HTML·둘 다)를 정합니다. 에이전트가 빠진 답만 묻습니다. 원본 PPT·엑셀 첨부는 별도로 선택합니다.\u003c/p\u003e\u003cp\u003e발표의 \u003cb\u003e인쇄 / PDF\u003c/b\u003e를 누르면 모든 장면과 숨겨진 설명 단계를 펼친 미리보기가 나옵니다. A4 가로 한 장에 장면 하나입니다. \u003cb\u003e인쇄 / PDF로 저장\u003c/b\u003e에서 브라우저의 PDF 저장 대상을 선택하세요. 머리글·바닥글은 인쇄 창에서 끌 수 있습니다. 돌아오면 원래 발표 단계가 유지되고 자동 재생은 정지합니다.\u003c/p\u003e\u003cp\u003e분석 자료의 \u003cb\u003e인쇄 / PDF\u003c/b\u003e는 현재 필터와 활성화한 상세표·가정 시나리오를 정적인 결과로 별도 출력합니다. 단독 HTML에서도 사용할 수 있습니다. 백업자료는 이름을 지정한 HTML 탭으로 최대 8개까지 넣을 수 있고, 예제에는 원본·계산 근거 탭이 있습니다. 발표 PDF와 자동 합본하지 않으며, 각 자료의 인쇄 레이아웃을 확인해야 합니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e8. 수치 검수와 결과 보고\u003c/h2\u003e\u003cp\u003e최종 전달 전에 원본 엑셀과 단위·표시 환산, 분모, 필터·범위, 반올림, 출처를 대조합니다. 단위 검수는 금액뿐 아니라 길이·면적·부피·질량·시간·속도·에너지/전력·복합/업무 단위를 포함합니다. unit_audit.py는 m/mm, m²/cm², L/m³, kg/t, km/h→m/s, 개/시간, 원/kg 등 지원하는 단위의 제공된 값을 대조합니다. 박스↔개는 출처가 있는 양수 환산 계수가 필요합니다. 미지원 단위, 차원 불일치, 섭씨·화씨 환산, 환율, 달력상의 월은 확인 필요로 남깁니다. 계산 통과가 엑셀 원본 검증을 대신하지 않으며, 캠페인 차트 자체는 원화 기반입니다. \u003cb\u003e지표 정의·계산 근거\u003c/b\u003e에서 원본 단위, 환산 자릿수, 분모 정의, 현재 필터, 원본 합계와 시트·범위를 확인할 수 있습니다. 원본은 원화이며 국문 금액은 1만원 이상부터 만원 단위 최대 소수 1자리, 영문은 100만원 이상부터 백만원 단위 최대 소수 2자리로 표시합니다. 추이 축은 같은 환산 단위로 최대 소수 1자리, 비율은 최대 소수 2자리입니다. 비율은 같은 선택 범위의 합계로 계산하며 행별 비율을 평균하지 않습니다.\u003c/p\u003e\u003cp\u003e에이전트는 \u003cb\u003e단위 / 분모 / 필터·범위 / 반올림 / 모션 끔·인쇄 정보 유지 / 출처\u003c/b\u003e 6개 항목을 각각 \u003cb\u003e통과 또는 확인 필요 / 근거·남은 확인\u003c/b\u003e 표로 보고합니다. 메타데이터가 있다는 이유만으로 원본 일치를 통과 처리하지 않습니다. 반올림한 부분 합계는 표시된 전체 합계와 다를 수 있으며 원본 정밀도로 계산합니다. 원본 정의나 검증이 빠진 항목은 확인 필요로 남깁니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e9. 모션 없이 읽고 인쇄하기\u003c/h2\u003e\u003cp\u003e모션 데모 아래의 \u003cb\u003e핵심 정보\u003c/b\u003e 요약에는 제목·설명·4단계·핵심 수치·주의사항이 남습니다. 재생 마지막에도 처음의 대표 수치를 읽을 수 있습니다. \u003cb\u003e모션 끄기\u003c/b\u003e로 움직임을 멈춰도 단계·타임라인은 직접 이동할 수 있습니다. 시스템의 모션 줄이기 설정이 우선하며, 도중에 켜면 현재 시점에서 멈춥니다. 설정을 해제해도 자동 재생하지 않습니다.\u003c/p\u003e\u003cp\u003e일반 발표는 모션 줄이기 또는 motion=none에서 현재 장면의 모든 항목을 보여주며 단계 위치는 유지합니다. 시스템 모션 줄이기에서는 자동 재생을 비활성화합니다. 모션 데모의 \u003cb\u003e인쇄 / PDF\u003c/b\u003e는 세 예제의 전체 요약을, 발표의 인쇄 미리보기는 모든 장면과 설명 단계를 보여줍니다. 돌아오면 원래 주제·시점 또는 발표 단계가 유지되고 재생은 정지합니다. 저장된 PDF 검증은 별도입니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e10. 지원 범위와 한계\u003c/h2\u003e\u003cp\u003ePPT의 픽셀 배치를 복원하기보다 설명 구조를 재설계합니다. 기본 PPTX 추출기는 텍스트·표·메모를 구분해서 읽으며 OCR, SmartArt 텍스트, 차트 워크북 해석은 지원하지 않습니다. 캠페인 예제는 검토한 데이터 모델을 입력받으며, 임의의 엑셀 수식·매크로·외부 연결을 자동 변환하지 않습니다. 다른 형태의 엑셀에는 별도로 검증한 변환 규칙이 필요합니다. MP4 출력은 후속 기능입니다.\u003c/p\u003e\u003cp\u003e정적 검사, AI 도구 실행 검사, 실제 브라우저 검증은 서로 다른 범위입니다. 구체적인 결과는 검증 기록을 확인하세요. 가상 예제 하나의 통과가 모든 파일·브라우저의 호환성을 보장하지 않습니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e11. 디자인 레퍼런스 사용\u003c/h2\u003e\u003cp\u003e웹사이트 URL, GitHub 저장소, 로컬 HTML·이미지, 스타일 이름 또는 네 가지 프리셋(\u003ccode\u003eslide-story\u003c/code\u003e, \u003ccode\u003edashboard\u003c/code\u003e, \u003ccode\u003edata-motion\u003c/code\u003e, \u003ccode\u003ehybrid\u003c/code\u003e)을 전달하세요. 분위기, 색상, 글꼴, 레이아웃, 카드, 차트, 모션, 내비게이션, 특정 장면 중 무엇을 적용할지도 지정할 수 있습니다.\u003c/p\u003e\u003cp\u003e기본 방식은 시각적 영감입니다. 에이전트는 추상적인 디자인 규칙을 분석해 프로젝트 소유 HTML/CSS/SVG로 새로 만들며 브랜드, 문구, 이미지, 아이콘, 예제 데이터, DOM, CSS를 복사하지 않습니다. 코드나 자산 재사용에는 확인된 라이선스와 출처 URL이 필요합니다. 결과물은 오프라인 단일 HTML을 유지하고 판단 근거를 \u003ccode\u003edesign-reference.json\u003c/code\u003e에 기록합니다.\u003c/p\u003e\u003c/section\u003e\u003cfooter\u003e개인·내부 업무는 무료입니다. 도구 유료 제공·외부 생성 서비스는 별도 서면 허가가 필요합니다.\u003cdetails\u003e\u003csummary\u003e라이선스 전문\u003c/summary\u003e\u003cpre\u003ePPT to HTML Agent Community License 1.0\nInternal Use and Presentation Output Exception\n\nCopyright (c) 2026 Chris-yoo80\n\nThis is a project-specific, source-available license. It is not the MIT\nLicense, an OSI-approved open source license, or n8n\u0026#x27;s lice (() => {
  'use strict';
  const deck = JSON.parse(document.getElementById('deck-data').textContent);
  const settings = {width:1600,height:900,motion:'key',playback:'manual',font:'system',end:'stop',...deck.settings};
  const english=deck.language==='en';
  const stage = document.getElementById('stage');
  const viewport = document.getElementById('viewport');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const steps = deck.scenes.flatMap((scene, sceneIndex) => scene.items.map((_, itemIndex) => ({sceneIndex, itemIndex})));
  let position = 0, timer = null, playing = false;
  const bookmarks=[];
  const text = (tag, className, value) => {
    const node = document.createElement(tag); node.className = className; node.textContent = value || ''; return node;
  };
  const svgNode = (tag, attrs) => {
    const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value)); return node;
  };
  function fit() {
    const rect = viewport.getBoundingClientRect();
    const scale = Math.min(rect.width/settings.width, rect.height/settings.height);
    stage.style.width = settings.width + 'px'; stage.style.height = settings.height + 'px';
    stage.style.transform = `translate(${(rect.width-settings.width*scale)/2}px,${(rect.height-settings.height*scale)/2}px) scale(${scale})`;
  }
  function diagram(scene, visibleCount) {
    const box = text('div', 'motion-box', '');
    const svg = svgNode('svg', {viewBox:'0 0 600 360',role:'img','aria-label':scene.motion_caption || scene.title});
    const colors = ['#355b37','#3158db','#7f9e53','#b5c886'];
    const count = scene.items.length;
    scene.items.forEach((item, index) => {
      const x = count === 1 ? 300 : 80+index*(440/(count-1));
      const on = index < visibleCount;
      const state = (on?' on':'')+(index===visibleCount-1?' active':'');
      if (scene.motion === 'lines' && index > 0) {
        svg.append(svgNode('path',{d:`M ${x-440/(count-1)+25} 175 H ${x-25}`,stroke:'#3158db','stroke-width':4,fill:'none',class:'motion-link'+state}));
      }
      if (scene.motion === 'planes') {
        svg.append(svgNode('rect',{x:x-50,y:95+index*12,width:100,height:150-index*10,rx:14,fill:colors[index],class:'motion-plane'+state}));
      } else {
        svg.append(svgNode('circle',{cx:x,cy:175,r:scene.motion==='points'?26:20,fill:colors[index],class:'motion-point'+state}));
      }
      const label=svgNode('text',{x,y:285,'text-anchor':'middle',class:'motion-label'});
      label.textContent=item.label; svg.append(label);
    });
    box.append(svg,text('p','motion-caption',scene.motion_caption || '개념 예시 · 실측 수치 아님'));
    return box;
  }
  function setPlaying(value) {
    clearTimeout(timer); timer=null;
    playing = value && !reduced.matches && (position < steps.length-1 || settings.end === 'loop');
    const button = document.getElementById('play');
    button.disabled=reduced.matches;
    button.textContent=playing?(english?'Pause':'일시 정지'):(english?'Autoplay':'자동 재생'); button.setAttribute('aria-pressed',String(playing));
    if (playing) timer=setTimeout(next,deck.scenes[steps[position].sceneIndex].duration*1000 || 7000);
  }
  function render() {
    const {sceneIndex,itemIndex}=steps[position], scene=deck.scenes[sceneIndex];
    const motionEnabled = settings.motion!=='none' && scene.motion && scene.motion!=='none';
    stage.replaceChildren(); stage.className=settings.font==='serif'?'serif':'';
    document.body.classList.toggle('motion-none',settings.motion==='none');
    document.body.classList.toggle('motion-rich',settings.motion==='rich');
    const top=text('div','deck-top',''); const mark=text('span','deck-mark','');
    mark.append(document.createElement('i'),document.createTextNode(deck.title));
    top.append(mark,text('span','',`${String(sceneIndex+1).padStart(2,'0')} / ${String(deck.scenes.length).padStart(2,'0')}`));
    stage.append(top,text('p','eyebrow',scene.eyebrow || 'INTERACTIVE PRESENTATION'),text('h1','scene-title',scene.title));
    if(scene.lead) stage.append(text('p','lead',scene.lead));
    const body=text('div',`scene-body ${scene.layout || 'cards'}${motionEnabled?'':' no-motion'}`,'');
    const list=text('div','item-list','');
    const showAll=reduced.matches||settings.motion==='none';
    scene.items.forEach((item,index)=>{
      const visible=showAll||index<=itemIndex;
      const card=text('section','item'+(visible?' on':'')+(index===itemIndex?' active':''),'');
      card.setAttribute('aria-hidden',String(!visible));
      card.append(text('span','item-index',String(index+1).padStart(2,'0')));
      const content=document.createElement('div');
      if(item.value) content.append(text('strong','item-value',item.value));
      content.append(text('h2','',item.label),text('p','',item.body));card.append(content); list.append(card);
    });
    body.append(list); if(motionEnabled) body.append(diagram(scene,showAll?scene.items.length:itemIndex+1)); stage.append(body);
    const bottom=text('footer','scene-bottom',''); bottom.append(text('p','message',scene.message),text('p','source',scene.source || ''));
    stage.append(bottom);
    document.getElementById('prev').disabled=position===0;
    document.getElementById('next').disabled=position===steps.length-1 && settings.end==='stop';
    document.getElementById('position').textContent=`${position+1} / ${steps.length} ${english?'steps':'단계'}${position===steps.length-1?(english?' · End':' · 끝'):''}`;
    document.getElementById('announcement').textContent=`${scene.title}. ${scene.items[itemIndex].label}`;
    fit(); setPlaying(playing);
  }
  function go(index){position=Math.max(0,Math.min(steps.length-1,index));render();}
  function next(){if(position<steps.length-1)go(position+1);else if(settings.end==='loop')go(0);else setPlaying(false);}
  function openDialog(id){
    setPlaying(false);
    const dialog=document.getElementById(id);
    if(typeof dialog.showModal==='function')dialog.showModal();else dialog.open=true;
    const first=dialog.children?.[0]?.children?.find?.(node=>node.tagName==='button') || dialog.children?.[0]?.children?.[1];
    first?.focus?.();
  }
  function closeDialog(id,returnId){
    const dialog=document.getElementById(id);
    if(typeof dialog.close==='function')dialog.close();else dialog.open=false;
    document.getElementById(returnId)?.focus();
  }
  function bookmarkLabel(index){
    const step=steps[index],scene=deck.scenes[step.sceneIndex],item=scene.items[step.itemIndex];
    return `${String(step.sceneIndex+1).padStart(2,'0')} · ${scene.title} · ${step.itemIndex+1}/${scene.items.length} ${item.label}`;
  }
  function updateBookmarks(){
    const root=document.getElementById('bookmarks-list');root.replaceChildren();
    if(!bookmarks.length)root.append(text('p','empty-bookmarks',english?'No questions marked yet.':'표시한 질문이 없습니다.'));
    bookmarks.forEach((stepIndex,index)=>{
      const row=text('div','bookmark-row','');
      const jump=text('button','bookmark-jump',bookmarkLabel(stepIndex));jump.type='button';
      jump.setAttribute('aria-label',(english?'Return to ':'질문 위치로 이동: ')+bookmarkLabel(stepIndex));
      jump.addEventListener('click',()=>{go(stepIndex);closeDialog('bookmarks-dialog','open-bookmarks');});
      const remove=text('button','bookmark-remove',english?'Remove':'삭제');remove.type='button';
      remove.setAttribute('aria-label',(english?'Remove ':'질문 표시 삭제: ')+bookmarkLabel(stepIndex));
      remove.addEventListener('click',()=>{bookmarks.splice(index,1);updateBookmarks();});
      row.append(jump,remove);root.append(row);
    });
    document.getElementById('return-bookmark').disabled=!bookmarks.length;
    document.getElementById('open-bookmarks').textContent=(english?'Question list':'질문 목록')+(bookmarks.length?` (${bookmarks.length})`:'');
  }
  function markQuestion(){
    setPlaying(false);
    if(!bookmarks.includes(position))bookmarks.push(position);
    updateBookmarks();
    document.getElementById('announcement').textContent=(english?'Question marked: ':'질문 표시: ')+bookmarkLabel(position);
  }
  function returnToLatest(){
    if(!bookmarks.length)return;
    setPlaying(false);go(bookmarks[bookmarks.length-1]);
  }
  function buildOutline(){
    const root=document.getElementById('outline-list');root.replaceChildren();
    let stepIndex=0;
    deck.scenes.forEach((scene,sceneIndex)=>{
      const group=text('section','outline-scene','');
      group.append(text('h2','',`${String(sceneIndex+1).padStart(2,'0')} · ${scene.title}`));
      const list=text('div','outline-steps','');
      scene.items.forEach((item,itemIndex)=>{
        const target=stepIndex++;
        const button=text('button','outline-step',`${itemIndex+1}. ${item.label}`);button.type='button';
        button.setAttribute('aria-label',(english?'Go to ':'이동: ')+bookmarkLabel(target));
        button.addEventListener('click',()=>{go(target);closeDialog('outline-dialog','open-outline');});list.append(button);
      });
      group.append(list);root.append(group);
    });
  }
  // Build one complete scene per printed page, independent of the current reveal.
  function preparePrint(){
    setPlaying(false);
    const original=position;
    let root=document.getElementById('print-pages');
    if(!root){root=text('div','','');root.id='print-pages';document.body.append(root);}
    root.replaceChildren();
    let end=-1;
    try{
      for(const scene of deck.scenes){
        end+=scene.items.length;position=end;render();
        const page=text('article','print-page','');
        const copy=stage.cloneNode(true);copy.removeAttribute('id');copy.className+=' print-stage';
        const scale=Math.min(1046/settings.width,699/settings.height);
        copy.style.transform=`scale(${scale})`;copy.style.width=settings.width+'px';copy.style.height=settings.height+'px';
        page.append(copy);root.append(page);
      }
    }finally{position=original;render();}
  }
  addEventListener('beforeprint',preparePrint);
  document.getElementById('print')?.addEventListener('click',()=>{
    preparePrint();document.body.classList.add('print-preview');
    document.getElementById('print-confirm').focus();
  });
  document.getElementById('print-confirm')?.addEventListener('click',()=>window.print());
  document.getElementById('print-close')?.addEventListener('click',()=>{
    document.body.classList.remove('print-preview');document.getElementById('print').focus();fit();
  });
  document.getElementById('prev').addEventListener('click',()=>go(position-1));
  document.getElementById('next').addEventListener('click',next);
  document.getElementById('play').addEventListener('click',()=>setPlaying(!playing));
  document.getElementById('play').hidden=settings.playback==='manual';
  document.getElementById('replay').addEventListener('click',()=>{setPlaying(false);go(0);});
  document.getElementById('open-outline').addEventListener('click',()=>openDialog('outline-dialog'));
  document.getElementById('outline-close').addEventListener('click',()=>closeDialog('outline-dialog','open-outline'));
  document.getElementById('bookmark-current').addEventListener('click',markQuestion);
  document.getElementById('open-bookmarks').addEventListener('click',()=>{updateBookmarks();openDialog('bookmarks-dialog');});
  document.getElementById('bookmarks-close').addEventListener('click',()=>closeDialog('bookmarks-dialog','open-bookmarks'));
  document.getElementById('return-bookmark').addEventListener('click',returnToLatest);
  document.getElementById('fullscreen').addEventListener('click',async()=>{
    try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}
    catch{document.getElementById('announcement').textContent='이 환경에서는 전체 화면을 사용할 수 없습니다.';}
  });
  addEventListener('keydown',event=>{
    if(document.body.classList.contains('print-preview')){
      if(event.key==='Escape')document.getElementById('print-close').click();return;
    }
    if(document.getElementById('supplements-dialog')?.open)return;
    if(document.getElementById('outline-dialog').open||document.getElementById('bookmarks-dialog').open){
      if(event.key==='Escape'){
        if(document.getElementById('outline-dialog').open)closeDialog('outline-dialog','open-outline');
        if(document.getElementById('bookmarks-dialog').open)closeDialog('bookmarks-dialog','open-bookmarks');
      }
      return;
    }
    if(event.altKey||event.ctrlKey||event.metaKey||event.target.closest('input,textarea,select,[contenteditable=true]'))return;
    // Arrow navigation still works after clicking a control. Space/Enter keep
    // their native button/link activation instead of triggering two actions.
    if(event.target.closest('button,a')&&[' ','Enter'].includes(event.key))return;
    if(['ArrowRight','PageDown',' '].includes(event.key)){event.preventDefault();next();}
    else if(['ArrowLeft','PageUp'].includes(event.key)){event.preventDefault();go(position-1);}
    else if(event.key==='Home'){event.preventDefault();go(0);}
    else if(event.key==='End'){event.preventDefault();go(steps.length-1);}
    else if(event.key.toLowerCase()==='a'&&settings.playback!=='manual')setPlaying(!playing);
    else if(event.key.toLowerCase()==='g'){event.preventDefault();openDialog('outline-dialog');}
    else if(event.key==='B'){event.preventDefault();updateBookmarks();openDialog('bookmarks-dialog');}
    else if(event.key.toLowerCase()==='b'){event.preventDefault();markQuestion();}
    else if(event.key.toLowerCase()==='r'){event.preventDefault();returnToLatest();}
    else if(event.key==='Escape')setPlaying(false);
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden)setPlaying(false);});
  addEventListener('ppt-open-supplement',()=>setPlaying(false));
  addEventListener('resize',fit); reduced.addEventListener('change',()=>{setPlaying(false);render();});
  buildOutline();updateBookmarks();render(); if(settings.playback==='auto')setPlaying(true);
})();

/* Supporting HTML runs in a sandboxed dialog; the presentation keeps its step. */
(()=>{
 const deck=JSON.parse(document.getElementById('deck-data').textContent),dialog=document.getElementById('supplements-dialog'),frames=[document.getElementById('supplement-frame')];let selected=0;
 function select(index){selected=index;const item=deck.supplements[index];if(!frames[index]){const frame=document.createElement('iframe');frame.id='supplement-resource-'+index;frame.setAttribute('sandbox','allow-scripts allow-downloads allow-forms allow-modals');dialog.append(frame);frames[index]=frame;}const frame=frames[index];frame.className='supplement-resource';if(!frame.srcdoc)frame.srcdoc=item.html;frame.title=item.label;frames.forEach((n,i)=>n.hidden=i!==index);document.querySelectorAll('#supplement-tabs button').forEach((n,i)=>n.setAttribute('aria-pressed',String(i===index)));}
 deck.supplements.forEach((item,index)=>{const button=document.createElement('button');button.type='button';button.textContent=item.label;button.addEventListener('click',()=>select(index));document.getElementById('supplement-tabs').append(button);});
 document.getElementById('open-supplements').addEventListener('click',()=>{dispatchEvent(new Event('ppt-open-supplement'));select(selected);dialog.showModal();});
 document.getElementById('close-supplements').addEventListener('click',()=>dialog.close());
 dialog.addEventListener('close',()=>{document.getElementById('open-supplements').focus();});
})();
</script></body></html>
