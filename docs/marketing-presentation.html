/* Data charts: drawn to scale; palette is overridable through these variables. */
:root{--chart-1:#3158db;--chart-2:#2f7d5b;--chart-3:#e07a2f;--chart-4:#7a5bd6;--chart-5:#c2416b;--chart-6:#5f8f2f;--chart-ink:#20251f;--chart-muted:#6a7564;--chart-grid:#e3e7dc}
.scene-body.has-chart{grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:36px;align-items:stretch}
.has-chart .item-list{align-content:center;gap:10px}
.has-chart .item{padding:14px 20px;grid-template-columns:40px 1fr;align-items:center}
/* Label and value share one row so four cards fit beside a chart. */
.has-chart .item>div{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:14px;align-items:baseline}
.has-chart .item h2{grid-row:1;grid-column:1;font-size:21px;margin:0}.has-chart .item-value{grid-row:1;grid-column:2;font-size:24px;margin:0;text-align:right}
.has-chart .item p{grid-row:2;grid-column:1/3;font-size:15px;margin-top:3px}
.has-chart.compare .item-list{grid-template-columns:1fr}
.chart-box{margin:0;background:#fff;border:1px solid #dce1d2;border-radius:20px;padding:22px 26px 16px;display:flex;flex-direction:column;min-height:0;box-shadow:0 14px 34px #20251f0d}
.chart-title{font-size:19px;font-weight:700;color:var(--chart-ink);margin:0 0 6px}
.chart-box svg{width:100%;flex:1;min-height:0;overflow:visible}
.chart-note{font-size:14px;color:var(--chart-muted);margin:6px 0 0;line-height:1.45}
.chart-grid{stroke:var(--chart-grid);stroke-width:1}.chart-baseline{stroke:#9aa392;stroke-width:1.5}
.chart-axis{font-size:13px;fill:var(--chart-muted)}
.chart-label{font-size:16px;fill:var(--chart-ink);font-weight:600}
.chart-value{font-size:18px;fill:var(--chart-ink);font-weight:800}
.chart-rate{font-size:15px;fill:var(--chart-muted);font-weight:600}
.chart-center{font-size:22px;font-weight:800;fill:var(--chart-ink)}
.series-0{fill:var(--chart-1)}.chart-bar.is-highlight,.chart-funnel.is-highlight{fill:var(--chart-3)}.series-1{fill:var(--chart-2)}.series-2{fill:var(--chart-3)}.series-3{fill:var(--chart-4)}.series-4{fill:var(--chart-5)}.series-5{fill:var(--chart-6)}
.chart-line{stroke:var(--chart-1);stroke-width:4;fill:none;stroke-linecap:round}
.chart-area{fill:var(--chart-1);opacity:.06}.chart-area.on{opacity:.12}
.chart-dot{fill:#fff;stroke:var(--chart-1);stroke-width:4}
.chart-bar,.chart-funnel,.chart-slice,.chart-key,.chart-line,.chart-dot,.chart-value,.chart-label,.chart-rate{opacity:.16}
.chart-bar.on,.chart-funnel.on,.chart-slice.on,.chart-key.on,.chart-line.on,.chart-dot.on,.chart-value.on,.chart-label.on,.chart-rate.on{opacity:1}
.chart-bar.active,.chart-funnel.active,.chart-slice.active{filter:drop-shadow(0 6px 10px #20251f30)}
@media print{.chart-bar,.chart-funnel,.chart-slice,.chart-key,.chart-line,.chart-dot,.chart-value,.chart-label,.chart-rate{opacity:1}.chart-box{box-shadow:none}}

/* Finite entrances: no unattended decorative looping. */
@keyframes point-in{from{opacity:.12;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes line-in{from{stroke-dashoffset:180;opacity:.12}to{stroke-dashoffset:0;opacity:1}}
@keyframes plane-in{from{opacity:.12;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes item-in{from{opacity:.22;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.motion-point.on.active{transform-box:fill-box;transform-origin:center;animation:point-in .6s ease both}
.motion-link.on.active{animation:line-in .9s ease both}
.motion-plane.on.active{animation:plane-in .7s ease both}
body.motion-rich .item.on.active{animation:item-in .45s ease both}
@media(prefers-reduced-motion:reduce){.motion-point.on.active,.motion-link.on.active,.motion-plane.on.active,body.motion-rich .item.on.active{animation:none;transition:none}}
/* Chart entrances: finite, data-preserving (final state equals the static chart). */
@keyframes chart-rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes chart-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes chart-pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes chart-draw{from{stroke-dasharray:600;stroke-dashoffset:600}to{stroke-dasharray:600;stroke-dashoffset:0}}
@keyframes chart-fade{from{opacity:0}}
.chart-bar.on.active,.chart-box.enter .chart-bar{transform-box:fill-box;transform-origin:bottom;animation:chart-rise .8s cubic-bezier(.2,.8,.2,1) both}
.chart-funnel.on.active,.chart-box.enter .chart-funnel{transform-box:fill-box;transform-origin:center;animation:chart-grow .8s cubic-bezier(.2,.8,.2,1) both}
.chart-slice.on.active,.chart-box.enter .chart-slice{transform-box:view-box;transform-origin:190px 190px;animation:chart-pop .7s ease both}
.chart-line.on.active,.chart-box.enter .chart-line{animation:chart-draw .9s ease both}
.chart-dot.on.active,.chart-value.on.active,.chart-rate.on.active,.chart-box.enter .chart-value{animation:chart-fade .6s .2s ease both}
.chart-box.enter .chart-bar,.chart-box.enter .chart-funnel{animation-delay:calc(var(--i,0)*.08s)}
body.motion-none .chart-box *{animation:none!important}
@media(prefers-reduced-motion:reduce){.chart-box *{animation:none!important}}

/* Component kit for composed scenes. All tokens are CSS variables so themes and deck css can restyle. */
:root{--k-accent:#3158db;--k-accent-dark:#1f3c9c;--k-accent-2:#2f7d5b;--k-soft:#eef1fb;--k-ink:#20251f;--k-muted:#66705f;--k-line:#dce1d2;--k-panel:#fff;--k-bg:#f6f7ef;--k-warn:#e07a2f;--k-good:#2f7d5b;--k-bad:#c2416b;--k-radius:14px;--k-shadow:0 10px 26px rgba(20,25,40,.06)}

/* Chrome: chapter tabs, breadcrumb, return control */
#chapter-nav{display:none}
body.has-chapters #chapter-nav{position:fixed;left:0;right:0;top:0;height:46px;z-index:5;display:flex;align-items:center;gap:4px;padding:0 18px;background:#fff;border-bottom:1px solid var(--k-line);overflow-x:auto;scrollbar-width:none}
body.has-chapters #viewport{top:46px}
.chapter-tab{border:0;background:transparent;color:var(--k-muted);font:inherit;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;white-space:nowrap}
.chapter-tab:hover{color:var(--k-ink);background:var(--k-soft)}
.chapter-tab.active{background:var(--k-accent);color:#fff}
.chapter-tab.backup{font-size:12px;padding:6px 8px}
.chapter-divider{margin:0 6px 0 10px;padding-left:12px;border-left:1px solid var(--k-line);font-size:11px;letter-spacing:.08em;color:var(--k-muted)}
.deck-top .breadcrumb{flex:1;text-align:center;font-size:14px;letter-spacing:0;color:var(--k-muted)}
.deck-top .page-count{font-variant-numeric:tabular-nums}
.deck-top .version-tag{margin-right:14px;padding:2px 9px;border:1px solid var(--k-line);border-radius:999px;font-size:12px;letter-spacing:0}
#return-origin{background:var(--k-accent);color:#fff;border-color:var(--k-accent)}
.outline-divider{margin:22px 0 4px;font-size:15px;color:var(--k-muted)}
.message-label{display:inline-block;margin-right:12px;padding:3px 10px;border-radius:6px;background:var(--k-accent);color:#fff;font-size:15px;vertical-align:2px}

/* Composed scene frame */
#stage.composed-scene,.print-stage.composed-scene{background:var(--k-bg);color:var(--k-ink);gap:16px;padding:40px 60px 34px}
.scene-title em{font-style:normal;color:var(--k-accent)}
.composed-scene .scene-title{font-size:44px;letter-spacing:-.03em}
.composed-scene .eyebrow{color:var(--k-accent);font-size:17px}
.lead.summary{font-size:19px;color:var(--k-ink);background:var(--k-soft);border-left:5px solid var(--k-accent);padding:9px 18px;border-radius:6px;max-width:none}
.scene-body.composed{flex:1;min-height:0;display:flex;flex-direction:column;align-items:stretch;font-size:16px;line-height:1.45}
.scene-body.composed>*{min-height:0}
.composed-scene .scene-bottom{padding-top:12px}

/* Step reveal */
.reveal-spotlight [data-step],.reveal-build [data-step]{transition:opacity .45s,filter .45s,box-shadow .45s,transform .45s}
.reveal-spotlight [data-step].dim{opacity:.36;filter:grayscale(.7)}
.reveal-spotlight [data-step].focus{box-shadow:0 0 0 3px var(--k-accent),var(--k-shadow);position:relative;z-index:1}
.reveal-build [data-step].pending{opacity:0;transform:translateY(12px)}
svg [data-step].focus{filter:drop-shadow(0 0 6px var(--k-accent))}
@media print{[data-step].dim,[data-step].pending{opacity:1!important;filter:none!important;transform:none!important}[data-step].focus{box-shadow:none!important}}

/* Layout */
.k-grid{display:grid;gap:18px;flex:1;min-height:0}
.k-grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.k-grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.k-grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.k-grid.cols-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.k-grid.cols-1-2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.k-grid.rows-2{grid-template-rows:repeat(2,minmax(0,1fr))}
.span-2{grid-column:span 2}.span-3{grid-column:span 3}.row-span-2{grid-row:span 2}
.k-stack{display:flex;flex-direction:column;gap:12px;min-height:0}
.k-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.k-fill{flex:1;min-height:0}

/* Panels */
.k-panel{background:var(--k-panel);border:1px solid var(--k-line);border-radius:var(--k-radius);padding:18px 20px;box-shadow:var(--k-shadow);display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
.k-panel.soft{background:var(--k-soft);box-shadow:none}
.k-panel.dark{background:var(--k-ink);color:#fff;border-color:var(--k-ink)}
.k-panel.accent{background:var(--k-accent);color:#fff;border-color:var(--k-accent)}
.k-panel-head{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;margin:0}
.k-panel-head small{margin-left:auto;font-size:12px;font-weight:600;color:var(--k-muted)}
.k-icon{flex:none;width:30px;height:30px;border-radius:9px;background:var(--k-soft);color:var(--k-accent);display:grid;place-items:center;font-size:15px;font-weight:800}
.k-panel h3,.k-panel h4{margin:0}
.k-panel p{margin:0}

/* Numbers */
.k-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.k-kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.k-kpi-label{font-size:14px;color:var(--k-muted);font-weight:600}
.k-kpi-value{font-size:42px;font-weight:800;color:var(--k-accent);line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.k-kpi-unit{font-size:18px;font-weight:700;margin-left:3px;color:var(--k-muted)}
.k-delta{font-size:14px;font-weight:800}.k-delta.up{color:var(--k-good)}.k-delta.down{color:var(--k-bad)}
.k-hero{background:linear-gradient(150deg,var(--k-accent),var(--k-accent-dark));color:#fff;border-radius:var(--k-radius);padding:24px 26px;display:flex;flex-direction:column;gap:8px}
.k-hero .k-kpi-value{color:#fff;font-size:68px}.k-hero .k-kpi-label,.k-hero .k-kpi-unit{color:#ffffffcc}
.k-panel.dark .k-kpi-value,.k-panel.accent .k-kpi-value{color:#fff}

/* Tables */
.k-table{width:100%;border-collapse:collapse;font-size:15px}
.k-table th{background:var(--k-soft);color:var(--k-accent-dark);font-weight:700;text-align:left;padding:8px 10px;border-bottom:2px solid var(--k-accent)}
.k-table td{padding:8px 10px;border-bottom:1px solid var(--k-line)}
.k-table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.k-table tr.hl td{background:var(--k-soft);font-weight:700}
.k-table tr.total td{border-top:2px solid var(--k-ink);font-weight:800}

/* Labels */
.k-chips{display:flex;flex-wrap:wrap;gap:6px}
.k-chip{display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;background:var(--k-soft);color:var(--k-accent-dark);font-size:13px;font-weight:700}
.k-tag{display:inline-flex;padding:2px 8px;border:1px solid var(--k-line);border-radius:6px;font-size:12px;color:var(--k-muted)}
.k-badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 8px;border-radius:13px;background:var(--k-accent);color:#fff;font-size:13px;font-weight:800}
.k-note{font-size:13px;color:var(--k-muted)}
.k-list{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.k-list li{position:relative;padding-left:16px}
.k-list li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--k-accent)}
.k-insight{display:flex;gap:14px;align-items:center;background:var(--k-panel);border:1px solid var(--k-line);border-left:5px solid var(--k-warn);border-radius:8px;padding:10px 16px;font-size:16px;font-weight:600}
.k-insight>b:first-child{flex:none;padding:3px 10px;border-radius:6px;background:var(--k-warn);color:#fff;font-size:13px}

/* Jumps to backup scenes */
button[data-goto]{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--k-accent);color:var(--k-accent);background:#fff;border-radius:7px;padding:5px 11px;cursor:pointer}
button[data-goto]::before{content:"▸ "}
button[data-goto]:hover{background:var(--k-accent);color:#fff}

/* Timeline (status list) */
.k-timeline{display:grid;gap:8px}
.k-tl-item{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:stretch}
.k-tl-date{display:grid;place-items:center;text-align:center;font-weight:800;color:var(--k-accent);background:var(--k-soft);border-radius:10px;padding:6px;font-size:14px}
.k-tl-item.now .k-tl-date{background:var(--k-accent);color:#fff}
.k-tl-body{border:1px solid var(--k-line);border-radius:10px;padding:8px 12px;background:var(--k-panel)}
.k-tl-item.now .k-tl-body{border-color:var(--k-accent)}
.k-tl-item.next .k-tl-body,.k-tl-item.next .k-tl-date{border-style:dashed;background:transparent}

/* Gantt: label column + N period columns; place bars with style="grid-column:3/6" */
.k-gantt{display:grid;grid-template-columns:var(--label,170px) repeat(var(--cols,12),minmax(0,1fr));row-gap:8px;column-gap:2px;align-items:center;font-size:13px}
.k-gantt-h{text-align:center;font-weight:700;color:var(--k-muted);border-bottom:1px solid var(--k-line);padding-bottom:4px}
.k-gantt-label{grid-column:1;font-weight:700;color:var(--k-ink)}
.k-gantt-bar{height:26px;border-radius:13px;background:var(--k-accent);color:#fff;font-weight:700;padding:0 10px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.k-gantt-bar.alt{background:var(--k-accent-2)}.k-gantt-bar.soft{background:var(--k-soft);color:var(--k-accent-dark)}
.k-gantt-bar.milestone{background:transparent;color:var(--k-warn);padding:0}
.k-gantt-bar.milestone::before{content:"◆";margin-right:4px}

/* Process flow (chevrons) */
.k-flow{display:flex;gap:4px;align-items:stretch}
.k-flow-step{flex:1;min-width:0;background:var(--k-soft);padding:12px 18px 12px 26px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);display:flex;flex-direction:column;gap:2px}
.k-flow-step:first-child{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);padding-left:16px}
.k-flow-step.active{background:var(--k-accent);color:#fff}
.k-flow-step b{font-size:15px}.k-flow-step small{font-size:12px;opacity:.85}

/* Progress */
.k-progress{height:9px;background:var(--k-soft);border-radius:5px;overflow:hidden}
.k-progress>i{display:block;height:100%;width:var(--v,0%);background:var(--k-accent);border-radius:5px}

/* Charts inside composed panels */
/* A chart container shrinks to its panel; the SVG scales down (never clips) to fit. */
[data-chart]{display:flex;flex-direction:column;min-height:0;min-width:0}
.scene-body.composed .chart-box{flex:1;min-height:0;box-shadow:none;border:0;padding:0;background:transparent}
.chart-connector{stroke:#9aa392;stroke-width:1.5;stroke-dasharray:4 3}
.wf-total{fill:var(--chart-1)}.wf-up{fill:var(--chart-2)}.wf-down{fill:var(--chart-5)}

/* Theme presets. Newly authored tokens; brand colors belong in a deck's own css. */

/* consulting: dense multi-panel report, index tabs on top, solid key-message bar */
body.theme-consulting{--k-accent:#5b2a92;--k-accent-dark:#3e1870;--k-accent-2:#9d4f9a;--k-soft:#f3edf8;--k-ink:#211a2e;--k-muted:#6c6480;--k-line:#e3dbea;--k-bg:#fbf9fc;--k-warn:#e2852f;--k-good:#2f8a6b;--k-bad:#c2416b;--k-radius:12px;
  --chart-1:#5b2a92;--chart-2:#9d4f9a;--chart-3:#e2852f;--chart-4:#c4a6dc;--chart-5:#c2416b;--chart-6:#8a83a0;--chart-ink:#211a2e;--chart-muted:#6c6480;--chart-grid:#ece6f1;
  font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.theme-consulting #stage{background:var(--k-bg)}
.theme-consulting .deck-mark i{background:var(--k-accent)}
.theme-consulting .composed-scene .eyebrow::before{content:"";display:inline-block;width:10px;height:10px;margin-right:8px;border-radius:3px;background:var(--k-accent)}
.theme-consulting .composed-scene .scene-bottom{border-top:0;background:var(--k-accent);color:#fff;border-radius:10px;padding:10px 18px}
.theme-consulting .composed-scene .message{font-size:19px}
.theme-consulting .composed-scene .message-label{background:#fff;color:var(--k-accent)}
.theme-consulting .composed-scene .source{color:#ffffffcc}
.theme-consulting .item.on .item-index{background:var(--k-accent);border-color:var(--k-accent);color:#fff}
.theme-consulting .item-value{color:var(--k-accent)}

/* executive: storytelling with spotlight, chapter tabs at the bottom, insight bar */
body.theme-executive{--k-accent:#e2681c;--k-accent-dark:#a94c12;--k-accent-2:#8a6a52;--k-soft:#fdf0e5;--k-ink:#1e2730;--k-muted:#66727d;--k-line:#dce0e4;--k-bg:#f5f4f1;--k-warn:#e2681c;--k-good:#2a7f79;--k-bad:#c8412b;--k-radius:10px;
  --chart-1:#e2681c;--chart-2:#2a7f79;--chart-3:#8a6a52;--chart-4:#2f5fa8;--chart-5:#c8412b;--chart-6:#9aa3ab;--chart-ink:#1e2730;--chart-muted:#66727d;--chart-grid:#e6e8ea;
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.theme-executive #stage{background:var(--k-bg)}
body.theme-executive.has-chapters #chapter-nav{top:auto;bottom:82px;border-bottom:0;border-top:1px solid var(--k-line)}
body.theme-executive.has-chapters #viewport{top:0;bottom:128px}
.theme-executive .chapter-tab.active{background:transparent;color:var(--k-ink);box-shadow:inset 0 -3px 0 var(--k-accent);border-radius:0}
.theme-executive .deck-mark i{background:var(--k-accent)}
.theme-executive .composed-scene .scene-title{font-weight:800}
.theme-executive .composed-scene .scene-title em{font-style:normal;color:var(--k-accent)}
.theme-executive .reveal-spotlight [data-step].focus{box-shadow:0 0 0 3px var(--k-accent),0 12px 28px rgba(226,104,28,.14)}
.theme-executive .composed-scene .scene-bottom{border-top:0;background:#fff;border:1px solid var(--k-line);border-left:5px solid var(--k-accent);border-radius:8px;padding:10px 16px}
.theme-executive .composed-scene .message{font-size:18px}
.theme-executive .item.on .item-index{background:var(--k-accent);border-color:var(--k-accent);color:#fff}
.theme-executive .item-value{color:var(--k-accent)}

/* In-browser review: edit and memo modes */
.editor-bar{position:fixed;top:7px;right:14px;z-index:8;display:flex;gap:6px}
.editor-bar button{border:1px solid #c9d1db;background:#fff;color:#1c232c;border-radius:7px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.editor-bar button[aria-pressed=true]{background:#1c232c;color:#fff;border-color:#1c232c}
.editor-bar button:focus-visible{outline:3px solid #355ee8;outline-offset:2px}
body.editing [contenteditable]{outline:2px dashed #3158db;outline-offset:3px;cursor:text;border-radius:2px}
body.editing [contenteditable]:focus{outline-style:solid;background:rgba(49,88,219,.07)}
body.memo-mode #stage,body.memo-mode #stage *{cursor:crosshair}
body.memo-mode #stage :hover{outline:2px solid rgba(226,104,28,.55);outline-offset:2px}
.was-edited{box-shadow:inset 0 -3px 0 rgba(255,193,7,.75)}
.has-memo{position:relative}
.has-memo::after{content:attr(data-memo);position:absolute;top:-12px;right:-12px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#e2681c;color:#fff;font:700 13px/24px "Malgun Gothic",system-ui,sans-serif;text-align:center;z-index:6;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.editor-banner{position:fixed;left:50%;top:54px;transform:translateX(-50%);z-index:20;margin:0;padding:8px 16px;border-radius:8px;background:#fff4e5;border:1px solid #e2a65c;color:#7a3e00;font-size:14px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.editor-banner[hidden]{display:none}
.editor-dialog{width:min(760px,calc(100vw - 32px))}
.memo-target{margin:14px 22px 6px;font-size:13px;color:#5d6876}
.memo-input{display:block;width:calc(100% - 44px);margin:0 22px;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #c9d1db;border-radius:8px;resize:vertical}
.editor-actions{display:flex;gap:10px;padding:14px 22px 18px}
.editor-actions button{border:1px solid #c9d1db;background:#fff;border-radius:8px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer}
.editor-actions button.primary{background:#1c232c;color:#fff;border-color:#1c232c}
.review-list{padding:14px 22px;max-height:460px;overflow:auto;display:grid;gap:10px}
.review-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 12px;border:1px solid #dde3ea;border-radius:8px;background:#fff}
.review-row b{grid-column:1/-1;font-size:13px}
.review-row .before{grid-column:1;font-size:14px;color:#7a8492;text-decoration:line-through}
.review-row .after{grid-column:1;font-size:15px}
.review-row.memo .before{text-decoration:none;font-size:13px}
.review-row.memo .bookmark-jump{grid-column:2;grid-row:2/4;align-self:center}
.review-row.numeric{border-color:#e2a65c;background:#fffaf2}
.review-note{margin:0 22px 18px;font-size:13px;color:#5d6876}
#print-pages .has-memo::after{display:none}
#print-pages .was-edited{box-shadow:none}
@media print{[data-editor-ui],.editor-banner{display:none!important}.has-memo::after{display:none}[contenteditable]{outline:none!important}.was-edited{box-shadow:none}}

#supplements-dialog{width:min(1500px,98%);max-width:none;height:94%;max-height:94%;padding:0;border:1px solid #cad5ca;border-radius:12px;background:#f5f6ef;color:#20392c}#supplements-dialog[open]{display:flex;flex-direction:column}#supplements-dialog::backdrop{background:#10241ce0}#supplements-dialog>header{display:flex;align-items:center;gap:15px;padding:12px 18px;background:white;border-bottom:1px solid #d8e0d4;flex-wrap:wrap}#supplements-title{font:700 13px system-ui,sans-serif;white-space:nowrap}#supplement-tabs{display:flex;gap:7px;flex:1}#supplements-dialog button{font:12px system-ui,sans-serif;padding:8px 12px;background:#edf3e8;color:#234232;border:1px solid #c7d6c5;border-radius:7px;cursor:pointer}#supplements-dialog button[aria-pressed=true]{background:#2a5843;color:white}#supplements-dialog #close-supplements{background:white}#supplements-dialog .supplement-resource{border:0;width:100%;min-height:0;flex:1;background:#f4f5f0}#supplements-dialog button:focus-visible{outline:3px solid #6186bc;outline-offset:3px}@media(max-width:600px){#supplements-dialog{width:100%;height:98%;max-height:98%;margin:auto}#supplements-dialog>header{padding:9px;gap:8px}#supplements-dialog button{font-size:10px;padding:8px}#supplements-title{font-size:11px}}

int());\n $('analysis-print-close').addEventListener('click',()=\u003e{document.body.classList.remove('analysis-print-preview');$('print-analysis').focus();});\n $('download-html').addEventListener('click',()=\u003e{const clone=document.documentElement.cloneNode(true),saved={...data,language,brief,localeKo:ko,savedState:{...filters(),scenario:$('scenario-enabled').checked,detail:$('detail-enabled').checked,budget:Number($('budget').value),conversion:Number($('conversion').value),aov:Number($('aov').value)}};clone.querySelector('body').classList.remove('analysis-print-preview');clone.querySelector('#analysis-data').textContent=JSON.stringify(saved).replaceAll('\u003c','\\\\u003c');clone.querySelectorAll('dialog').forEach(n=\u003en.removeAttribute('open'));clone.querySelectorAll('body \u003e *').forEach(n=\u003e{if(!n.matches('header.masthead,div.app,dialog#setup-dialog,dialog#method-dialog,script#analysis-data,script#analysis-model,script#analysis-ui,template#analysis-license,aside#analysis-print-toolbar'))n.remove();});clone.querySelectorAll('head \u003e *').forEach(n=\u003e{if(!n.matches('meta[charset],meta[name=viewport],title,style#analysis-css'))n.remove();});save('campaign-analysis.'+language+'.html','\u003c!doctype html\u003e\\n'+clone.outerHTML,'text/html;charset=utf-8');});\n if(data.savedState){const s=data.savedState;$('week').value=s.week;$('region').value=s.region;document.querySelectorAll('input[name=channel]').forEach(n=\u003en.checked=s.channels.includes(n.value));$('scenario-enabled').checked=Boolean(s.scenario);$('detail-enabled').checked=Boolean(s.detail);for(const k of ['budget','conversion','aov'])$(k).value=s[k];}\n addEventListener('resize',drawTrend);syncBrief();languageUI();render();if(!data.brief)$('setup-dialog').showModal();\n})();\n\u003c/script\u003e\u003c/body\u003e\u003c/html\u003e\n"}, {"id": "guide-ko", "label": "사용설명서 (KO)", "html": "\u003c!doctype html\u003e\u003chtml lang=\"ko\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\u003ctitle\u003e사용설명서 · PPT to HTML Agent\u003c/title\u003e\u003cstyle\u003e*{box-sizing:border-box}body{margin:0;background:#f3f5ee;color:#22392e;font:15px/1.85 \"Malgun Gothic\",system-ui,sans-serif}main{max-width:980px;margin:auto;padding:40px 28px}nav{display:flex;gap:16px;flex-wrap:wrap;font-size:12px}a{color:#286449}h1{font-size:38px;line-height:1.25;letter-spacing:-1.5px;margin:22px 0 14px}h2{font-size:23px;margin:36px 0 12px;letter-spacing:-.6px}h3{font-size:16px}p{margin:8px 0}.eyebrow{font-size:10px;letter-spacing:2px;color:#7e9382}.lead{font-size:17px;color:#6a806b;max-width:760px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:25px 0}.step{border-top:2px solid #6c9474;padding-top:12px}.step b{font-size:13px}.step p{font-size:12px;color:#788a76}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e6eee0;padding:20px;border-radius:10px;font:12px/1.9 Consolas,monospace}code{font-family:Consolas,monospace;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #d5dfcf;padding:12px 10px;vertical-align:top}th{color:#6c846b;font-weight:500}.notice{border-left:3px solid #668f72;padding:8px 17px;font-size:13px;background:#eaf0e3}.links{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.links a{background:#fff;border:1px solid #ccd9c6;padding:9px 14px;border-radius:7px;text-decoration:none;font-size:12px}footer{margin-top:40px;border-top:1px solid #d3dfcc;padding-top:20px;font-size:11px;color:#7c8d74}@media(max-width:600px){main{padding:25px 18px}h1{font-size:29px}.steps{grid-template-columns:1fr}th,td{padding:10px 6px;font-size:12px}}\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\u003cmain\u003e\u003cnav\u003e\u003ca href=\"https://github.com/Chris-yoo80/ppt-to-html-agent\"\u003eGitHub ↗\u003c/a\u003e \u003ca href=\"guide.en.html\"\u003eEnglish\u003c/a\u003e\u003c/nav\u003e\u003cp class=\"eyebrow\"\u003ePPT TO HTML AGENT / USER GUIDE\u003c/p\u003e\u003ch1\u003e발표에 근거 자료까지,\u003cbr\u003eHTML로 함께.\u003c/h1\u003e\u003cp class=\"lead\"\u003e스킬은 AI 작업 환경에서 사용합니다. 발표는 간결하게 이어가고, 필요한 순간 추가 HTML을 열어 분석 근거를 확인하세요.\u003c/p\u003e\u003cdiv class=\"links\"\u003e\u003ca href=\"https://chris-yoo80.github.io/ppt-to-html-agent/downloads/ppt-to-html.zip\"\u003e스킬 ZIP 내려받기\u003c/a\u003e\u003ca href=\"https://chris-yoo80.github.io/ppt-to-html-agent/marketing-presentation.html\"\u003e발표 + 추가 자료 예제\u003c/a\u003e\u003ca href=\"https://chris-yoo80.github.io/ppt-to-html-agent/marketing-analysis.html\"\u003e보충 분석 HTML만 열기\u003c/a\u003e\u003c/div\u003e\u003csection id=\"install\"\u003e\u003ch2\u003e1. 스킬 설치하기\u003c/h2\u003e\u003cp\u003e시작 전에 Claude Code 또는 Codex가 설치·로그인되어 있어야 하고, 보조 도구에는 Python 3.10 이상이 필요합니다. Windows는 \u003ccode\u003epython --version\u003c/code\u003e, macOS·리눅스는 \u003ccode\u003epython3 --version\u003c/code\u003e으로 확인합니다. macOS·리눅스에서는 예시의 \u003ccode\u003epython\u003c/code\u003e을 \u003ccode\u003epython3\u003c/code\u003e으로 바꿔 입력하세요.\u003c/p\u003e\u003cp\u003e\u003cb\u003e가장 쉬운 방법:\u003c/b\u003e ZIP을 풀고 Claude Code나 Codex에서 내 프로젝트 폴더를 연 뒤 설치를 요청합니다.\u003c/p\u003e\u003cpre\u003e다운로드 폴더의 ppt-to-html 폴더를 이 프로젝트의 Claude Code 스킬로 설치해줘.\n최종 위치가 .claude/skills/ppt-to-html/SKILL.md가 되게 하고, 한 단계 더 깊으면 안 돼.\n설치 후 경로를 확인하고 스킬 호출 방법을 알려줘.\u003c/pre\u003e\u003cp\u003eCodex는 “Codex 스킬”과 \u003ccode\u003e.agents/skills/ppt-to-html/SKILL.md\u003c/code\u003e로 바꿔 요청합니다. 직접 넣으려면 \u003ccode\u003eppt-to-html/\u003c/code\u003e 폴더 전체를 아래 위치 중 하나에 넣습니다.\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003cth\u003e도구\u003c/th\u003e\u003cth\u003e이 프로젝트에서만 (프로젝트 폴더 안)\u003c/th\u003e\u003cth\u003e모든 프로젝트에서 (사용자 폴더)\u003c/th\u003e\u003cth\u003e호출\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eClaude Code\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e.claude/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e~/.claude/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e/ppt-to-html\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCodex\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e.agents/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e~/.agents/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e$ppt-to-html\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cdiv class=\"notice\"\u003e최종 위치는 \u003ccode\u003eskills/ppt-to-html/SKILL.md\u003c/code\u003e여야 하며 한 단계 더 깊으면 인식되지 않습니다. Windows의 “압축 풀기”는 ZIP 이름의 폴더를 하나 더 만듭니다. \u003ccode\u003eskills\u003c/code\u003e 폴더 자체에 풀거나, 푼 뒤 안쪽 \u003ccode\u003eppt-to-html\u003c/code\u003e 폴더를 한 단계 위로 옮기세요.\u003c/div\u003e\u003cp\u003e점(.)으로 시작하는 폴더는 숨겨져 있습니다. Windows는 파일 탐색기 → 보기 → 표시 → 숨긴 항목, macOS는 Finder에서 \u003ccode\u003eCmd+Shift+.\u003c/code\u003e을 누르세요. \u003ccode\u003e~\u003c/code\u003e는 \u003ccode\u003eC:\\Users\\이름\u003c/code\u003e, \u003ccode\u003e/Users/이름\u003c/code\u003e 같은 사용자 폴더입니다.\u003c/p\u003e\u003cp\u003eAI 도구에서 프로젝트 폴더를 엽니다(실행 중이었다면 다시 시작). Claude Code는 \u003ccode\u003e/\u003c/code\u003e, Codex는 \u003ccode\u003e$\u003c/code\u003e를 입력해 \u003ccode\u003eppt-to-html\u003c/code\u003e이 보이는지 확인합니다. 업데이트할 때는 기존 폴더를 지우고 새로 넣습니다. 소개 사이트는 파일 업로드·변환 서비스를 제공하지 않습니다. AI 구독료·사용료는 사용하는 서비스의 조건을 따릅니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e2. 첫 요청과 기초 설정\u003c/h2\u003e\u003cpre\u003eppt-to-html 스킬로 이 PPT를 HTML 발표로 재구성해줘.\n목적·청중·시간·화면 크기·글꼴·모션 빈도·재생 방식 중\n아직 알려주지 않은 설정만 질문해줘.\n마케팅 분석은 발표 안에서 여는 추가 HTML로 넣어줘.\n왼쪽에는 조정값과 슬라이서, 오른쪽에는 결과와 차트를 배치해줘.\n전체 제작 전에 목차와 대표 화면 하나부터 보여줘.\u003c/pre\u003e\u003cp\u003e보충 분석은 먼저 엑셀을 채팅에 첨부하거나 접근 가능한 로컬 경로로 제공합니다. 에이전트는 사용할 시트·범위와 분석 배치 위치(추가 자료, 별도 HTML 링크, 또는 둘 다), 관련 발표 장면·주제, 자료 탭 이름을 묻습니다. 이후 기간, 통화·단위, 지표 정의, 필터, 화면, 글꼴, 언어, 공유 범위를 정합니다. 이는 에이전트와의 대화 절차이며 이 웹사이트의 엑셀 업로드 기능이 아닙니다. 현재 플레이어는 발표 전체의 추가 자료 버튼을 사용하며, 장면별 버튼은 별도 구현이 필요합니다. “추천 설정으로”라고 한 번에 답해도 됩니다. 이미 전달한 설정은 다시 묻지 않습니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e3. 기초 화면부터 만들고 확장하기\u003c/h2\u003e\u003cdiv class=\"steps\"\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e01 / 설정 합의\u003c/b\u003e\u003cp\u003e목적·원문 의미·기본 배치를 정합니다.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e02 / 대표 화면 검토\u003c/b\u003e\u003cp\u003e목차와 대표 장면 또는 차트 하나를 확인합니다.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e03 / 필요한 기능 추가\u003c/b\u003e\u003cp\u003e기초 화면을 승인한 뒤 상세표·가정·내보내기를 추가합니다.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e결과물은 발표 HTML, 보충 분석 HTML, 편집용 소스입니다. 보충 HTML을 발표 안에 포함할 수 있어, 메인 파일 하나로 서버 없이 오프라인에서 사용할 수 있습니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e4. 발표와 추가 자료 조작\u003c/h2\u003e\u003ctable\u003e\u003ctr\u003e\u003cth\u003e조작\u003c/th\u003e\u003cth\u003e동작\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e← / →\u003c/td\u003e\u003ctd\u003e설명 단계를 이동합니다. Home은 처음으로 돌아갑니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e목차 / G\u003c/td\u003e\u003ctd\u003e모든 장면과 설명 단계를 열고 원하는 위치로 바로 이동합니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e질문 표시 / B\u003c/td\u003e\u003ctd\u003e현재 장면과 정확한 설명 단계를 저장합니다. Shift+B는 전체 질문 표시를 엽니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e질문 복귀 / R\u003c/td\u003e\u003ctd\u003e가장 최근 표시로 돌아갑니다. 이전 표시는 질문 목록에서 선택합니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e자동 재생 / A\u003c/td\u003e\u003ctd\u003e선택적으로 자동 진행합니다. 기본은 마지막에 정지입니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e추가 자료\u003c/td\u003e\u003ctd\u003e자동 재생을 멈추고 발표 위에 보충 HTML을 엽니다. 같은 세션의 발표 위치와 질문 표시는 유지됩니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e발표로 돌아가기 / Escape\u003c/td\u003e\u003ctd\u003e열기 전 발표 단계로 돌아옵니다. 자동 재생은 직접 다시 켭니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e자료 탭\u003c/td\u003e\u003ctd\u003e마케팅 분석과 HTML 설명서를 선택합니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e장 탭\u003c/td\u003e\u003ctd\u003e해당 장의 첫 단계로 바로 이동합니다. 자료실(백업) 장면은 구분선 뒤에 있고 다음 버튼으로는 넘어가지 않습니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e▸ 바로가기 / ↩ 돌아가기\u003c/td\u003e\u003ctd\u003e백업·상세 장면을 열고, 돌아가기를 누르면 떠났던 정확한 단계로 돌아옵니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e편집 / E · 메모 / M · 검토\u003c/td\u003e\u003ctd\u003e오른쪽 위 검토 도구입니다. 화면에서 글을 고치고, 수정 요청을 남기고, 수정본을 저장하거나 내보냅니다(13번).\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e단계 링크\u003c/td\u003e\u003ctd\u003e주소창에 항상 \u003ccode\u003e#scene=…\u0026amp;step=…\u003c/code\u003e가 표시됩니다. 복사해 보내면 같은 장면과 단계가 바로 열립니다.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e5. 마케팅 분석 화면 사용하기\u003c/h2\u003e\u003cp\u003e처음 열면 분석 목적, 우선 지표, 화면, 글꼴과 CSV 설정을 선택합니다. 왼쪽에서 기간·채널·시장을 고르면 오른쪽 KPI, 매출·광고비 추이, 전환 수치, 채널별 ROAS가 함께 바뀝니다. 원본 상세표는 필요할 때 추가합니다.\u003c/p\u003e\u003cp\u003e가정 시나리오는 원본 성과를 변경하지 않습니다. 클릭당 비용과 채널 비중을 고정한 상태에서 광고비·전환율·객단가 배수를 적용하며, 실제 예측을 뜻하지 않습니다. ROAS는 전체 매출 ÷ 전체 광고비, 전환율은 전체 구매 ÷ 전체 클릭입니다. 분모가 0이면 값을 계산하지 않습니다.\u003c/p\u003e\u003cp\u003e\u003cb\u003eHTML 저장\u003c/b\u003e은 현재 기초 설정·필터·가정을 단일 파일에 보관합니다. CSV는 기초 설정에서 허용한 경우에만 내려받을 수 있습니다. 원본 엑셀 파일은 자동 첨부하지 않습니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e6. 공유 범위 확인하기\u003c/h2\u003e\u003cdiv class=\"notice\"\u003e오프라인 HTML에는 차트를 계산하는 데이터가 포함됩니다. CSV 버튼을 끄는 것으로 데이터가 제거되거나 기밀 자료가 보호되지는 않습니다.\u003c/div\u003e\u003cp\u003e공유 전 발표자 메모, 숨김 시트, 첨부 파일, 개인정보, 내부 경로를 확인합니다. 원본 PPT·엑셀 첨부는 명시적으로 선택하고 검토한 경우에만 포함합니다. 이 프로젝트의 공개 예제는 새로 작성한 가상 자료입니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e7. PDF 출력과 백업자료 탭\u003c/h2\u003e\u003cp\u003e처음에 발표 PDF·분석 PDF 중 필요한 범위와 백업자료 파일, 관련 장면·주제, 탭 이름, 배치 위치(추가 자료·별도 HTML·둘 다)를 정합니다. 에이전트가 빠진 답만 묻습니다. 원본 PPT·엑셀 첨부는 별도로 선택합니다.\u003c/p\u003e\u003cp\u003e발표의 \u003cb\u003e인쇄 / PDF\u003c/b\u003e를 누르면 모든 장면과 숨겨진 설명 단계를 펼친 미리보기가 나옵니다. A4 가로 한 장에 장면 하나입니다. \u003cb\u003e인쇄 / PDF로 저장\u003c/b\u003e에서 브라우저의 PDF 저장 대상을 선택하세요. 머리글·바닥글은 인쇄 창에서 끌 수 있습니다. 돌아오면 원래 발표 단계가 유지되고 자동 재생은 정지합니다.\u003c/p\u003e\u003cp\u003e분석 자료의 \u003cb\u003e인쇄 / PDF\u003c/b\u003e는 현재 필터와 활성화한 상세표·가정 시나리오를 정적인 결과로 별도 출력합니다. 단독 HTML에서도 사용할 수 있습니다. 백업자료는 이름을 지정한 HTML 탭으로 최대 8개까지 넣을 수 있고, 예제에는 원본·계산 근거 탭이 있습니다. 발표 PDF와 자동 합본하지 않으며, 각 자료의 인쇄 레이아웃을 확인해야 합니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e8. 수치 검수와 결과 보고\u003c/h2\u003e\u003cp\u003e최종 전달 전에 원본 엑셀과 단위·표시 환산, 분모, 필터·범위, 반올림, 출처를 대조합니다. 단위 검수는 금액뿐 아니라 길이·면적·부피·질량·시간·속도·에너지/전력·복합/업무 단위를 포함합니다. unit_audit.py는 m/mm, m²/cm², L/m³, kg/t, km/h→m/s, 개/시간, 원/kg 등 지원하는 단위의 제공된 값을 대조합니다. 박스↔개는 출처가 있는 양수 환산 계수가 필요합니다. 미지원 단위, 차원 불일치, 섭씨·화씨 환산, 환율, 달력상의 월은 확인 필요로 남깁니다. 계산 통과가 엑셀 원본 검증을 대신하지 않으며, 캠페인 차트 자체는 원화 기반입니다. \u003cb\u003e지표 정의·계산 근거\u003c/b\u003e에서 원본 단위, 환산 자릿수, 분모 정의, 현재 필터, 원본 합계와 시트·범위를 확인할 수 있습니다. 원본은 원화이며 국문 금액은 1만원 이상부터 만원 단위 최대 소수 1자리, 영문은 100만원 이상부터 백만원 단위 최대 소수 2자리로 표시합니다. 추이 축은 같은 환산 단위로 최대 소수 1자리, 비율은 최대 소수 2자리입니다. 비율은 같은 선택 범위의 합계로 계산하며 행별 비율을 평균하지 않습니다.\u003c/p\u003e\u003cp\u003e에이전트는 \u003cb\u003e단위 / 분모 / 필터·범위 / 반올림 / 모션 끔·인쇄 정보 유지 / 출처\u003c/b\u003e 6개 항목을 각각 \u003cb\u003e통과 또는 확인 필요 / 근거·남은 확인\u003c/b\u003e 표로 보고합니다. 메타데이터가 있다는 이유만으로 원본 일치를 통과 처리하지 않습니다. 반올림한 부분 합계는 표시된 전체 합계와 다를 수 있으며 원본 정밀도로 계산합니다. 원본 정의나 검증이 빠진 항목은 확인 필요로 남깁니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e9. 모션 없이 읽고 인쇄하기\u003c/h2\u003e\u003cp\u003e모션 데모 아래의 \u003cb\u003e핵심 정보\u003c/b\u003e 요약에는 제목·설명·4단계·핵심 수치·주의사항이 남습니다. 재생 마지막에도 처음의 대표 수치를 읽을 수 있습니다. \u003cb\u003e모션 끄기\u003c/b\u003e로 움직임을 멈춰도 단계·타임라인은 직접 이동할 수 있습니다. 시스템의 모션 줄이기 설정이 우선하며, 도중에 켜면 현재 시점에서 멈춥니다. 설정을 해제해도 자동 재생하지 않습니다.\u003c/p\u003e\u003cp\u003e일반 발표는 모션 줄이기 또는 motion=none에서 현재 장면의 모든 항목을 보여주며 단계 위치는 유지합니다. 시스템 모션 줄이기에서는 자동 재생을 비활성화합니다. 모션 데모의 \u003cb\u003e인쇄 / PDF\u003c/b\u003e는 세 예제의 전체 요약을, 발표의 인쇄 미리보기는 모든 장면과 설명 단계를 보여줍니다. 돌아오면 원래 주제·시점 또는 발표 단계가 유지되고 재생은 정지합니다. 저장된 PDF 검증은 별도입니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e10. 지원 범위와 한계\u003c/h2\u003e\u003cp\u003ePPT의 픽셀 배치를 복원하기보다 설명 구조를 재설계합니다. 기본 PPTX 추출기는 텍스트·표·메모를 구분해서 읽으며 OCR, SmartArt 텍스트, 차트 워크북 해석은 지원하지 않습니다. 캠페인 예제는 검토한 데이터 모델을 입력받으며, 임의의 엑셀 수식·매크로·외부 연결을 자동 변환하지 않습니다. 다른 형태의 엑셀에는 별도로 검증한 변환 규칙이 필요합니다. MP4 출력은 후속 기능입니다.\u003c/p\u003e\u003cp\u003e정적 검사, AI 도구 실행 검사, 실제 브라우저 검증은 서로 다른 범위입니다. 구체적인 결과는 검증 기록을 확인하세요. 가상 예제 하나의 통과가 모든 파일·브라우저의 호환성을 보장하지 않습니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e11. 디자인 레퍼런스 사용\u003c/h2\u003e\u003cp\u003e웹사이트 URL, GitHub 저장소, 로컬 HTML·이미지, 스타일 이름 또는 네 가지 프리셋(\u003ccode\u003eslide-story\u003c/code\u003e, \u003ccode\u003edashboard\u003c/code\u003e, \u003ccode\u003edata-motion\u003c/code\u003e, \u003ccode\u003ehybrid\u003c/code\u003e)을 전달하세요. 분위기, 색상, 글꼴, 레이아웃, 카드, 차트, 모션, 내비게이션, 특정 장면 중 무엇을 적용할지도 지정할 수 있습니다.\u003c/p\u003e\u003cp\u003e기본 방식은 시각적 영감입니다. 에이전트는 추상적인 디자인 규칙을 분석해 프로젝트 소유 HTML/CSS/SVG로 새로 만들며 브랜드, 문구, 이미지, 아이콘, 예제 데이터, DOM, CSS를 복사하지 않습니다. 코드나 자산 재사용에는 확인된 라이선스와 출처 URL이 필요합니다. 결과물은 오프라인 단일 HTML을 유지하고 판단 근거를 \u003ccode\u003edesign-reference.json\u003c/code\u003e에 기록합니다.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e12. 보고서형 장면과 차트\u003c/h2\u003e\u003cp\u003e보고·검토·제안 발표에서는 에이전트가 \u003cb\u003e구성형 장면\u003c/b\u003e을 만듭니다. 한 화면에 패널 2~3개를 두고, 패널마다 근거에 맞는 시각화를 씁니다. 제목은 결론을, 요약 막대는 핵심 수치를, 하단 Key Message·시사점 막대는 장면의 결론을 담습니다.\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003cth\u003e구성\u003c/th\u003e\u003cth\u003e하는 일\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e차트\u003c/td\u003e\u003ctd\u003e막대·선·퍼널·도넛·워터폴을 0부터 실제 비율로 그립니다. 퍼널 전환율과 도넛 비중은 데이터에서 계산합니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e스포트라이트 단계\u003c/td\u003e\u003ctd\u003e클릭할 때마다 지금 설명하는 패널에 테두리를 두르고 나머지는 흐리게 남겨 맥락을 유지합니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e구성 요소\u003c/td\u003e\u003ctd\u003eKPI 숫자, 강조 행이 있는 표, 간트, 프로세스 흐름, 진행 타임라인, 진행 막대, 직접 그린 SVG 그림.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e장과 자료실\u003c/td\u003e\u003ctd\u003e장 탭, 현재 위치 표시, 자료실(백업) 장면, 정확한 단계로 돌아오는 바로가기 버튼.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e디자인은 정해진 템플릿이 아니라 내용을 따릅니다. 에이전트는 내용·청중·브랜드에 맞춰 디자인 방향을 정하고, AI 도구에 설치된 디자인 스킬(예: frontend-design, UI/UX, 데이터 시각화 스킬)이 있으면 활용하며, 장면마다 구성을 다르게 합니다. \u003ccode\u003econsulting\u003c/code\u003e(여러 패널·상단 장 탭)과 \u003ccode\u003eexecutive\u003c/code\u003e(경영진 스토리·스포트라이트·하단 장 탭) 프리셋은 출발점일 뿐입니다. 브랜드 색이나 마음에 드는 참고 디자인을 알려주세요. 라이선스가 확인된 아이콘·차트 패턴은 재사용하고, 참고용 갤러리는 영감으로만 씁니다.\u003c/p\u003e\u003cdiv class=\"notice\"\u003e차트·막대 길이·그림 속 수치는 모두 원본에서 계산합니다. 전달 전에 수치 검수 결과를 요청하세요.\u003c/div\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e13. 화면에서 바로 수정·메모하기\u003c/h2\u003e\u003cp\u003e모든 발표의 오른쪽 위에 검토 도구가 있습니다.\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003cth\u003e도구\u003c/th\u003e\u003cth\u003e사용법\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e편집 / E\u003c/td\u003e\u003ctd\u003e모든 단계를 펼치고 제목·요약 막대·패널 문장·카드 문구·시사점을 클릭해 바로 고칩니다. 배치·디자인·차트 값은 잠겨 있습니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e메모 / M\u003c/td\u003e\u003ctd\u003e아무 요소나 클릭해 “이 문장 짧게”, “출처 확인”, “막대 차트로” 같은 수정 요청을 남깁니다. 번호 표시가 붙습니다.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e검토\u003c/td\u003e\u003ctd\u003e수정 전·후와 메모 목록을 보고 \u003cb\u003e수정본 HTML 저장\u003c/b\u003e 또는 \u003cb\u003e수정 내역 내보내기(JSON)\u003c/b\u003e를 합니다.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e\u003cb\u003e수정본 HTML 저장\u003c/b\u003e은 수정과 메모가 담긴 새 오프라인 파일을 만듭니다. 다시 빌드해도 수정이 남도록 원본까지 고치려면 \u003ccode\u003edeck-edits.json\u003c/code\u003e을 에이전트에게 주고 반영을 요청하세요. 에이전트는 화면에서 본 글과 원본이 같은 곳만 고치고, 메모마다 답하며, 반영하지 못한 항목을 알려줍니다.\u003c/p\u003e\u003cdiv class=\"notice\"\u003e숫자나 단위를 바꾸면 경고가 뜹니다. 글을 고쳐도 차트·막대 길이·합계는 바뀌지 않으며, 에이전트가 원본과 다시 대조해 고칩니다.\u003c/div\u003e\u003cp\u003e다른 서식이 섞인 글(예: 숫자와 따로 꾸민 단위)과 그림 안의 글자는 직접 고칠 수 없으니 메모로 요청하세요. 인쇄는 항상 청중이 보는 화면으로 나옵니다.\u003c/p\u003e\u003c/section\u003e\u003cfooter\u003e개인·내부 업무는 무료입니다. 도구 유료 제공·외부 생성 서비스는 별도 서면 허가가 필요합니다.\u003cdetails\u003e\u003csummary\u003e라이선스 전문\u003c/summary\u003e\u003cpre\u003ePPT to HTML Agent Community Li irement to star the repository,\npublish your private source documents, or disclose your internal changes.\n\n6. Reserved rights and termination\n\nRights not expressly given here remain with their respective holders.\nNo right to use the Licensor\u0026#x27;s name or marks to imply endorsement is\ngranted. Permissions under these terms cease for a use that violates\nthem. The Licensor may give separate permissions in writing.\n\n7. Warranty and liability\n\nThe Package is supplied without a promise of fitness, correctness,\navailability, or continued support. To the extent applicable law permits,\nthe Licensor gives no warranties and accepts no liability for loss or\ndamage arising from its use. Nothing here removes a right or liability\nthat applicable law does not allow the parties to exclude.\n\nThe English text above is the controlling license. Translations and\nplain-language summaries are explanatory and do not add permissions.\n\u003c/pre\u003e\u003c/details\u003e\u003cbr\u003eCopyright © 2026 Chris-yoo80 · Community License 1.0\u003c/footer\u003e\u003c/main\u003e\u003c/body\u003e\u003c/html\u003e"}, {"id": "guide-en", "label": "User guide (EN)", "html": "\u003c!doctype html\u003e\u003chtml lang=\"en\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\u003ctitle\u003eUser guide · PPT to HTML Agent\u003c/title\u003e\u003cstyle\u003e*{box-sizing:border-box}body{margin:0;background:#f3f5ee;color:#22392e;font:15px/1.85 \"Malgun Gothic\",system-ui,sans-serif}main{max-width:980px;margin:auto;padding:40px 28px}nav{display:flex;gap:16px;flex-wrap:wrap;font-size:12px}a{color:#286449}h1{font-size:38px;line-height:1.25;letter-spacing:-1.5px;margin:22px 0 14px}h2{font-size:23px;margin:36px 0 12px;letter-spacing:-.6px}h3{font-size:16px}p{margin:8px 0}.eyebrow{font-size:10px;letter-spacing:2px;color:#7e9382}.lead{font-size:17px;color:#6a806b;max-width:760px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:25px 0}.step{border-top:2px solid #6c9474;padding-top:12px}.step b{font-size:13px}.step p{font-size:12px;color:#788a76}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e6eee0;padding:20px;border-radius:10px;font:12px/1.9 Consolas,monospace}code{font-family:Consolas,monospace;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #d5dfcf;padding:12px 10px;vertical-align:top}th{color:#6c846b;font-weight:500}.notice{border-left:3px solid #668f72;padding:8px 17px;font-size:13px;background:#eaf0e3}.links{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.links a{background:#fff;border:1px solid #ccd9c6;padding:9px 14px;border-radius:7px;text-decoration:none;font-size:12px}footer{margin-top:40px;border-top:1px solid #d3dfcc;padding-top:20px;font-size:11px;color:#7c8d74}@media(max-width:600px){main{padding:25px 18px}h1{font-size:29px}.steps{grid-template-columns:1fr}th,td{padding:10px 6px;font-size:12px}}\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\u003cmain\u003e\u003cnav\u003e\u003ca href=\"https://github.com/Chris-yoo80/ppt-to-html-agent\"\u003eGitHub ↗\u003c/a\u003e \u003ca href=\"guide.ko.html\"\u003e한국어\u003c/a\u003e\u003c/nav\u003e\u003cp class=\"eyebrow\"\u003ePPT TO HTML AGENT / USER GUIDE\u003c/p\u003e\u003ch1\u003eA presentation, with its supporting analysis.\u003c/h1\u003e\u003cp class=\"lead\"\u003eUse the skill in your AI environment. Keep the presentation concise, then open an additional HTML analysis whenever you need the evidence.\u003c/p\u003e\u003cdiv class=\"links\"\u003e\u003ca href=\"https://chris-yoo80.github.io/ppt-to-html-agent/downloads/ppt-to-html.zip\"\u003eDownload skill ZIP\u003c/a\u003e\u003ca href=\"https://chris-yoo80.github.io/ppt-to-html-agent/marketing-presentation.en.html\"\u003ePresentation + resources demo\u003c/a\u003e\u003ca href=\"https://chris-yoo80.github.io/ppt-to-html-agent/marketing-analysis.en.html\"\u003eStandalone supporting HTML\u003c/a\u003e\u003c/div\u003e\u003csection id=\"install\"\u003e\u003ch2\u003e1. Install the skill\u003c/h2\u003e\u003cp\u003eBefore you start: Claude Code or Codex must be installed and signed in, and Python 3.10+ is needed for bundled helpers. Check with \u003ccode\u003epython --version\u003c/code\u003e on Windows or \u003ccode\u003epython3 --version\u003c/code\u003e on macOS/Linux; macOS/Linux users type \u003ccode\u003epython3\u003c/code\u003e wherever examples say \u003ccode\u003epython\u003c/code\u003e.\u003c/p\u003e\u003cp\u003e\u003cb\u003eEasiest:\u003c/b\u003e unpack the ZIP, open your project folder in Claude Code or Codex, and ask the agent to install it:\u003c/p\u003e\u003cpre\u003eInstall the ppt-to-html folder from my Downloads folder as a Claude Code skill for this project.\nThe result must be .claude/skills/ppt-to-html/SKILL.md, not one folder deeper.\nThen check the path and tell me how to invoke the skill.\u003c/pre\u003e\u003cp\u003eFor Codex, say “Codex skill” and \u003ccode\u003e.agents/skills/ppt-to-html/SKILL.md\u003c/code\u003e. To copy the folder yourself, put the complete \u003ccode\u003eppt-to-html/\u003c/code\u003e folder in one of these locations:\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003cth\u003eHost\u003c/th\u003e\u003cth\u003eOne project (inside your project folder)\u003c/th\u003e\u003cth\u003eEvery project (user folder)\u003c/th\u003e\u003cth\u003eInvoke\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eClaude Code\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e.claude/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e~/.claude/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e/ppt-to-html\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCodex\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e.agents/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e~/.agents/skills/ppt-to-html/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e$ppt-to-html\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cdiv class=\"notice\"\u003eThe result must be \u003ccode\u003eskills/ppt-to-html/SKILL.md\u003c/code\u003e, not one folder deeper. Windows “Extract All” adds a folder named after the ZIP; extract to the \u003ccode\u003eskills\u003c/code\u003e folder itself or move the inner \u003ccode\u003eppt-to-html\u003c/code\u003e folder up one level.\u003c/div\u003e\u003cp\u003eFolders starting with a dot are hidden: on Windows use File Explorer → View → Show → Hidden items; on macOS press \u003ccode\u003eCmd+Shift+.\u003c/code\u003e in Finder. \u003ccode\u003e~\u003c/code\u003e is your user folder, such as \u003ccode\u003eC:\\Users\\name\u003c/code\u003e or \u003ccode\u003e/Users/name\u003c/code\u003e.\u003c/p\u003e\u003cp\u003eOpen your project folder in the host (restart it if it was running). Type \u003ccode\u003e/\u003c/code\u003e in Claude Code or \u003ccode\u003e$\u003c/code\u003e in Codex and check that \u003ccode\u003eppt-to-html\u003c/code\u003e appears. To update, delete the old folder and install the new one. The website does not upload or convert files. Your AI provider’s subscription or usage charges still apply.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e2. Start with the brief\u003c/h2\u003e\u003cpre\u003eUse the ppt-to-html skill to reconstruct this PPT as an HTML presentation.\nAsk only for missing settings: purpose, audience, time, screen size,\ntypeface, motion frequency, playback and supporting material.\nI want marketing analysis as additional HTML inside the presentation.\nPlace controls and slicers on the left, visual results on the right.\nShow the outline and one representative scene before building the rest.\u003c/pre\u003e\u003cp\u003eFor the supporting analysis, first provide the workbook as a chat attachment or accessible local path. The agent asks which sheets/ranges to use and where to place the analysis: Additional resources, a standalone HTML link, or both. Specify the related scene/topic and resource tab label. Then agree on period, currency, KPI definitions, filters, screen, font, language and sharing scope. This is an agent conversation step, not a workbook upload control on this website. The current player uses a presentation-wide resources button; scene-specific controls require a separate extension. Accept recommended defaults in one answer if you prefer. Reuse answers already supplied.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e3. Build the basics, then extend\u003c/h2\u003e\u003cdiv class=\"steps\"\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e01 / Agree\u003c/b\u003e\u003cp\u003eConfirm the brief, source meaning and layout.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e02 / Review\u003c/b\u003e\u003cp\u003eCheck an outline and a representative scene or chart.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e03 / Extend\u003c/b\u003e\u003cp\u003eAdd detail, scenarios and exports after the base is accepted.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003eThe finished deliverables are presentation HTML, supporting-analysis HTML and editable sources. Supporting HTML can be embedded in the presentation, so the main file works offline without a sidecar server.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e4. Present and open additional resources\u003c/h2\u003e\u003ctable\u003e\u003ctr\u003e\u003cth\u003eControl\u003c/th\u003e\u003cth\u003eBehavior\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e← / →\u003c/td\u003e\u003ctd\u003eMove through reveal steps. Home returns to the start.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eContents / G\u003c/td\u003e\u003ctd\u003eOpen every scene and reveal step, then jump directly to one.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMark question / B\u003c/td\u003e\u003ctd\u003eSave the current scene and exact reveal step. Shift+B opens all marks.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eReturn to question / R\u003c/td\u003e\u003ctd\u003eReturn to the latest mark. Choose an earlier mark from Question list.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAutoplay / A\u003c/td\u003e\u003ctd\u003eOptional automatic progression. Stops at the end by default.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAdditional resources\u003c/td\u003e\u003ctd\u003ePauses autoplay and opens supporting HTML over the presentation. The step and question marks remain in the same session.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eBack to presentation / Escape\u003c/td\u003e\u003ctd\u003eReturns to the same reveal step. Resume autoplay explicitly.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eResources tabs\u003c/td\u003e\u003ctd\u003eChoose the marketing analysis or this HTML guide.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eChapter tabs\u003c/td\u003e\u003ctd\u003eJump to the first step of a chapter. Backup scenes are listed after a divider and are not reached by Next.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e▸ Jump button / ↩ Back\u003c/td\u003e\u003ctd\u003eOpens a backup or detail scene; Back returns to the exact step you left.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eEdit / E · Memo / M · Review\u003c/td\u003e\u003ctd\u003eTop-right review tools: fix text in place, leave change requests, save or export the changes (section 13).\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eStep link\u003c/td\u003e\u003ctd\u003eThe address bar always shows \u003ccode\u003e#scene=…\u0026amp;step=…\u003c/code\u003e. Copy it to send someone a link that opens the same scene and step.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e5. Explore the marketing supplement\u003c/h2\u003e\u003cp\u003eOn first open, choose purpose, priority metrics, viewing context, font and CSV controls. On the left, select period, channels and market. On the right, review KPIs, revenue/spend trends, conversion counts and channel ROAS. Add the source detail table only when needed.\u003c/p\u003e\u003cp\u003eWhat-if sliders keep source results unchanged. They assume constant cost per click and channel mix, with separate conversion and order-value multipliers. These are hypothetical scenarios, not forecasts. ROAS uses total revenue / total spend; conversion uses total purchases / total clicks. A zero denominator is unavailable.\u003c/p\u003e\u003cp\u003e\u003cb\u003eSave HTML\u003c/b\u003e retains the current brief, filters and assumptions in one file. CSV downloads are opt-in in Initial setup. The source workbook is not automatically attached.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e6. Share the right information\u003c/h2\u003e\u003cdiv class=\"notice\"\u003eOffline HTML contains the data needed for its charts. Turning off CSV buttons does not remove that data or secure confidential information.\u003c/div\u003e\u003cp\u003eReview notes, hidden sheets, embedded files, personal information, internal paths and source attachments before sharing. Include raw PPT or Excel files only when explicitly selected and reviewed. Public examples in this project use newly authored fictional data.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e7. PDF output and backup tabs\u003c/h2\u003e\u003cp\u003eAt the start, tell the agent whether you need a deck PDF, analysis PDF, or both. Specify backup files, their related scene/topic, tab labels and placement (Additional resources, a separate HTML link, or both). The agent asks for missing answers and reuses known settings. Raw PPT/Excel attachments remain a separate opt-in choice.\u003c/p\u003e\u003cp\u003eIn the presentation, choose \u003cb\u003ePrint / PDF\u003c/b\u003e to preview all scenes with every reveal visible, one scene per A4 landscape page. Choose \u003cb\u003ePrint / Save as PDF\u003c/b\u003e, select the browser's PDF destination, and save. Return to the same presentation step; autoplay remains paused. Browser headers/footers can be disabled in the print dialog.\u003c/p\u003e\u003cp\u003ePrint supporting analysis separately using its \u003cb\u003ePrint / PDF\u003c/b\u003e control, or open its standalone HTML. It uses the current filters and enabled detail/scenario sections. Motion and slicers become static results. Backup resources are labeled HTML tabs (up to eight); the example includes source/calculation notes. They are not automatically merged into the deck PDF. Review each resource's own print layout before sharing.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e8. Verify the numbers\u003c/h2\u003e\u003cp\u003eBefore delivery, compare units and any displayed conversion, denominators, filters/ranges, rounding and source references against the original workbook. Unit review includes length, area, volume, mass, time, speed, energy/power and compound/business units, not just money. The bundled unit_audit.py checks declared conversions such as m/mm, m²/cm², L/m³, kg/t, km/h→m/s, item/h and KRW/kg. Box/item conversions need a positive per-source-unit factor and its definition source. Unknown units, incompatible dimensions, Celsius/Fahrenheit offsets, exchange rates and calendar months remain Needs review. A passed arithmetic comparison is not an automatic workbook audit; campaign charts remain KRW-based. In \u003cb\u003eDefinitions and evidence\u003c/b\u003e, inspect source units, conversion precision, rate definitions, current filters, source totals and sheet/range. Amounts are sourced in KRW; Korean views abbreviate amounts of at least KRW 10,000 in units of 10,000 (max one decimal), English views abbreviate amounts of at least KRW 1,000,000 in millions (max two decimals). Trend axes use those divisors with max one decimal; rates use max two decimals. Ratios use the same selected group, not an average of row ratios.\u003c/p\u003e\u003cp\u003eThe agent's final report must include six rows: \u003cb\u003eunits / denominators / filters and ranges / rounding / motion-off and print retention / provenance\u003c/b\u003e, each with \u003cb\u003ePassed or Needs review\u003c/b\u003e and supporting evidence. Metadata describes the implementation; it does not automatically certify agreement with your workbook. Rounded parts may differ from the rounded total; calculations retain source precision. Missing source definitions or checks remain Needs review.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e9. Read without motion\u003c/h2\u003e\u003cp\u003eThe motion demos keep a static \u003cb\u003eKey facts\u003c/b\u003e summary below the player: title, explanation, all four phases, figures and qualifications. Earlier headline figures remain available at the final frame. Use \u003cb\u003eTurn motion off\u003c/b\u003e to stop animation and keep manual chapter/timeline navigation. System reduced motion takes precedence. Switching it on pauses at the current time; turning it off does not resume playback automatically.\u003c/p\u003e\u003cp\u003eIn the presentation, reduced motion or motion=none reveals all items in the current scene while retaining its navigation step. Autoplay is disabled under system reduced motion. The demo's \u003cb\u003ePrint / PDF\u003c/b\u003e previews all three summaries. The presentation previews every scene, including staged content. Return to the same story/time or presentation step, with playback paused. Saved-PDF verification is separate.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e10. Supported scope\u003c/h2\u003e\u003cp\u003eThe skill redesigns the narrative rather than reproducing PPT pixels. Basic PPTX extraction reads text, tables and separate notes; OCR, SmartArt text and chart workbook interpretation are not included. The campaign starter accepts a reviewed data model; it does not automatically interpret arbitrary Excel formulas, macros or external connections. Other workbook types require a separately validated adapter. MP4 export is deferred.\u003c/p\u003e\u003cp\u003eStatic checks, host CLI tests and real browser checks cover different things. See the verification record for the exact observations; a single fictional example does not establish compatibility with every workbook or browser.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e11. Use a design reference\u003c/h2\u003e\u003cp\u003eProvide a website URL, GitHub repository, local HTML/image, named style or one of four presets: \u003ccode\u003eslide-story\u003c/code\u003e, \u003ccode\u003edashboard\u003c/code\u003e, \u003ccode\u003edata-motion\u003c/code\u003e and \u003ccode\u003ehybrid\u003c/code\u003e. State whether to apply mood, color, typography, layout, cards, charts, motion, navigation or selected scenes.\u003c/p\u003e\u003cp\u003eThe default is visual inspiration. The agent extracts abstract rules and rebuilds them with project-owned HTML/CSS/SVG; it does not copy branding, text, images, icons, sample data, DOM or CSS. Code or asset reuse requires a verified license and source URL. The output stays an offline single HTML file and records decisions in \u003ccode\u003edesign-reference.json\u003c/code\u003e.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e12. Report-style scenes and charts\u003c/h2\u003e\u003cp\u003eFor reports, reviews and proposals the agent builds \u003cb\u003ecomposed scenes\u003c/b\u003e: two or three panels per screen, each with the visual its evidence needs. The title states the conclusion, a summary bar carries the key figures and a Key Message or insight bar closes the screen.\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003cth\u003ePart\u003c/th\u003e\u003cth\u003eWhat it does\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCharts\u003c/td\u003e\u003ctd\u003eBar, line, funnel, donut and waterfall, drawn to scale from zero. Funnel rates and donut shares are computed from the data.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSpotlight steps\u003c/td\u003e\u003ctd\u003eEach click outlines the panel being explained and dims the rest, so the context stays visible.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eComponents\u003c/td\u003e\u003ctd\u003eKPI tiles, tables with highlighted rows, Gantt, process flow, status timeline, progress bars and custom SVG illustrations.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eChapters and backup\u003c/td\u003e\u003ctd\u003eChapter tabs, a breadcrumb, backup scenes in 자료실 and jump buttons that return to the exact step.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003eThe design follows the content rather than a template. The agent chooses a visual direction from the content, audience and brand, uses design skills installed in your AI tool when available (for example frontend-design, UI/UX or data-visualization skills) and varies the composition from scene to scene. The \u003ccode\u003econsulting\u003c/code\u003e (dense panels, index tabs on top) and \u003ccode\u003eexecutive\u003c/code\u003e (storytelling with spotlight, tabs at the bottom) presets are starting points only. Tell the agent your brand colors or a reference you like; licensed icons and chart patterns can be reused, and look-only galleries are used for inspiration.\u003c/p\u003e\u003cdiv class=\"notice\"\u003eEvery number in a chart, bar width or illustration is calculated from the source. Ask for the numeric review before delivery.\u003c/div\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e13. Fix text and leave memos on screen\u003c/h2\u003e\u003cp\u003eEvery presentation has review tools in the top-right corner.\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003cth\u003eTool\u003c/th\u003e\u003cth\u003eUse\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eEdit / E\u003c/td\u003e\u003ctd\u003eShows every step and lets you click titles, summary bars, panel text, card labels and key messages to change them. Layout, styles and chart data stay locked.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMemo / M\u003c/td\u003e\u003ctd\u003eClick any element and write a change request, such as “shorten this”, “check the source” or “use a bar chart”. A numbered badge marks it.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eReview\u003c/td\u003e\u003ctd\u003eLists edits (before and after) and memos, then \u003cb\u003eSave edited HTML\u003c/b\u003e or \u003cb\u003eExport changes (JSON)\u003c/b\u003e.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e\u003cb\u003eSave edited HTML\u003c/b\u003e creates a new offline file that reopens with your edits and memos. To update the source so the next build keeps your changes, give \u003ccode\u003edeck-edits.json\u003c/code\u003e to the agent and ask it to apply the review. The agent applies only text that still matches what you saw, answers each memo and reports anything it could not apply.\u003c/p\u003e\u003cdiv class=\"notice\"\u003eIf an edit changes a number or unit, a banner warns you. Charts, bar widths and totals are not changed by text edits; the agent re-checks them against the source and updates them.\u003c/div\u003e\u003cp\u003eMixed text (for example a number with a separately styled unit) and text inside drawings are not editable directly; leave a memo instead. Printing always shows the audience view.\u003c/p\u003e\u003c/section\u003e\u003cfooter\u003ePersonal/internal use is free. Paid redistribution of the tool or external generation services require separate written permission.\u003cdetails\u003e\u003csummary\u003eComplete license\u003c/summary\u003e\u003cpre\u003ePPT to HTML Agent Community License 1.0\nInternal Use and Presentation Output Exception\n\nCopyright (c) 2026 Chris-yoo80\n\nThis is a project-specific, source-available license. It is not the MIT\nLicense, an OSI-appr (() => {
  'use strict';
  const deck = JSON.parse(document.getElementById('deck-data').textContent);
  const settings = {width:1600,height:900,motion:'key',playback:'manual',font:'system',end:'stop',...deck.settings};
  const english=deck.language==='en';
  const stage = document.getElementById('stage');
  const viewport = document.getElementById('viewport');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  // Resolve player controls once, before any scene content exists, so scene ids can never shadow them.
  const ui = {};
  ['chapter-nav','prev','next','position','announcement','play','replay','open-outline','outline-dialog','outline-close','outline-list',
   'bookmark-current','open-bookmarks','bookmarks-dialog','bookmarks-close','bookmarks-list','return-bookmark','return-origin',
   'fullscreen','print','print-confirm','print-close','print-pages','supplements-dialog'].forEach(id=>{ui[id]=document.getElementById(id);});
  const byId = id => ui[id];
  // Card scenes reveal items; composed scenes reveal their named steps.
  const labelsOf = scene => scene.items ? scene.items.map(item => item.label) : scene.steps;
  const plain = value => value.split('**').length%2 ? value.split('**').join('') : value;
  // Backup scenes sit after the main sequence: reachable by chapter tab, contents or data-goto, never by Next.
  const order = deck.scenes.map((_, index) => index).sort((a, b) => Number(Boolean(deck.scenes[a].backup)) - Number(Boolean(deck.scenes[b].backup)) || a - b);
  const steps = order.flatMap(sceneIndex => labelsOf(deck.scenes[sceneIndex]).map((_, itemIndex) => ({sceneIndex, itemIndex})));
  const mainCount = steps.filter(step => !deck.scenes[step.sceneIndex].backup).length;
  const firstStep = id => steps.findIndex(step => deck.scenes[step.sceneIndex].id === id);
  let position = 0, timer = null, playing = false, returnTo = null;
  // Optional editor support: data provenance of rendered nodes, refreshed every render.
  const view = {editing:false, revealAll:false, targets:[], hooks:[]};
  const track = (node, ref, editable) => view.targets.push({node, ref, editable});
  const chapterTabs = [];
  const bookmarks=[];
  const text = (tag, className, value) => {
    const node = document.createElement(tag); node.className = className; node.textContent = value || ''; return node;
  };
  const svgNode = (tag, attrs) => {
    const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value)); return node;
  };
  function fit() {
    const rect = viewport.getBoundingClientRect();
    const scale = Math.min(rect.width/settings.width, rect.height/settings.height);
    stage.style.width = settings.width + 'px'; stage.style.height = settings.height + 'px';
    stage.style.transform = `translate(${(rect.width-settings.width*scale)/2}px,${(rect.height-settings.height*scale)/2}px) scale(${scale})`;
  }
  function diagram(scene, visibleCount) {
    const box = text('div', 'motion-box', '');
    const svg = svgNode('svg', {viewBox:'0 0 600 360',role:'img','aria-label':scene.motion_caption || scene.title});
    const colors = ['#355b37','#3158db','#7f9e53','#b5c886'];
    const count = scene.items.length;
    scene.items.forEach((item, index) => {
      const x = count === 1 ? 300 : 80+index*(440/(count-1));
      const on = index < visibleCount;
      const state = (on?' on':'')+(index===visibleCount-1?' active':'');
      if (scene.motion === 'lines' && index > 0) {
        svg.append(svgNode('path',{d:`M ${x-440/(count-1)+25} 175 H ${x-25}`,stroke:'#3158db','stroke-width':4,fill:'none',class:'motion-link'+state}));
      }
      if (scene.motion === 'planes') {
        svg.append(svgNode('rect',{x:x-50,y:95+index*12,width:100,height:150-index*10,rx:14,fill:colors[index],class:'motion-plane'+state}));
      } else {
        svg.append(svgNode('circle',{cx:x,cy:175,r:scene.motion==='points'?26:20,fill:colors[index],class:'motion-point'+state}));
      }
      const label=svgNode('text',{x,y:285,'text-anchor':'middle',class:'motion-label'});
      label.textContent=item.label; svg.append(label);
    });
    box.append(svg,text('p','motion-caption',scene.motion_caption || '개념 예시 · 실측 수치 아님'));
    return box;
  }
  // Charts are data, not decoration: linear scales from zero, exact labels in
  // text nodes, and full visibility whenever motion is reduced or printed.
  // Show every source decimal (up to 6) so labels stay exact; ticks pass their own precision.
  const decimals = value => Math.min(6,(String(value).split('.')[1]||'').length);
  const numberFormat = (value,digits=decimals(value)) => Number(value).toLocaleString(english?'en-US':'ko-KR',{maximumFractionDigits:digits});
  const percent = value => (Math.round(value*10)/10).toFixed(1)+'%';
  function niceMax(value){
    if(value<=0) return 1;
    const power=10**Math.floor(Math.log10(value)), unit=value/power;
    return ([1,1.2,2,2.4,3,4,5,6,8,10].find(step=>unit<=step))*power; // each divides evenly into 4 ticks
  }
  function svgText(svg, x, y, value, className, anchor='middle'){
    const node=svgNode('text',{x,y,'text-anchor':anchor,class:className}); node.textContent=value; svg.append(node); return node;
  }
  function chart(scene, visibleCount, entering, currentStep=Infinity) {
    const spec=scene.chart, data=spec.data, linked=Boolean(scene.items)&&data.length===scene.items.length;
    // spec.steps maps each datum to a composed-scene step; otherwise data follow card items when counts match.
    const stepOf=Array.isArray(spec.steps)?index=>spec.steps[index]:null;
    const shown=index=>stepOf?stepOf(index)<=currentStep:!linked || index<visibleCount;
    const active=index=>stepOf?stepOf(index)===currentStep:linked&&index===visibleCount-1;
    const state=index=>(shown(index)?' on':'')+(active(index)?' active':'');
    const highlight=new Set((spec.highlight||[]).map(value=>typeof value==='number'?value:data.findIndex(item=>item.label===value)));
    const tone=index=>highlight.has(index)?' is-highlight':'';
    const display=item=>item.display || numberFormat(item.value)+(spec.unit||'');
    // Linked charts animate the newly revealed datum; unlinked charts animate once on scene entry.
    const box=text('figure',`chart-box chart-type-${spec.type}${!linked&&entering?' enter':''}`,'');
    if(spec.title) box.append(text('figcaption','chart-title',spec.title));
    const svg=svgNode('svg',{viewBox:'0 0 640 380',role:'group','aria-label':spec.title || scene.title});
    const notes=[];
    if(spec.type==='bar' || spec.type==='line' || spec.type==='waterfall'){
      // Waterfall: totals stand on zero, deltas float from the running total.
      let running=0;
      const spans=data.map((item,index)=>{
        const total=(item.kind || (index===0?'total':'delta'))==='total', from=total?0:running, to=total?item.value:running+item.value;
        running=to; return {from,to,kind:total?'total':item.value>=0?'up':'down'};
      });
      const peak=spec.type==='waterfall'?Math.max(...spans.map(span=>Math.max(span.from,span.to))):Math.max(...data.map(item=>item.value));
      const max=niceMax(peak), left=56, right=616, top=36, bottom=300;
      const y=value=>bottom-(value/max)*(bottom-top), step=(right-left)/data.length;
      for(let tick=0;tick<=4;tick++){
        const value=max*tick/4;
        svg.append(svgNode('path',{d:`M ${left} ${y(value)} H ${right}`,class:'chart-grid'}));
        svgText(svg,left-10,y(value)+5,numberFormat(value,Math.max(0,2-Math.floor(Math.log10(max)))),'chart-axis','end');
      }
      if(spec.type==='line'){
        const points=data.map((item,index)=>[left+step*(index+.5),y(item.value)]);
        svg.append(svgNode('path',{d:`M ${points[0][0]} ${bottom} `+points.map(p=>`L ${p[0]} ${p[1]}`).join(' ')+` L ${points.at(-1)[0]} ${bottom} Z`,class:'chart-area'+(data.every((_,i)=>shown(i))?' on':'')}));
        points.slice(1).forEach((point,index)=>svg.append(svgNode('path',{d:`M ${points[index][0]} ${points[index][1]} L ${point[0]} ${point[1]}`,class:'chart-line'+state(index+1)})));
        points.forEach((point,index)=>svg.append(svgNode('circle',{cx:point[0],cy:point[1],r:9,class:'chart-dot'+state(index)})));
        points.forEach((point,index)=>svgText(svg,point[0],point[1]-20,display(data[index]),'chart-value'+state(index)));
      } else if(spec.type==='waterfall'){
        const width=Math.min(76,step*.6);
        spans.forEach((span,index)=>{
          const x=left+step*(index+.5), high=Math.max(span.from,span.to), item=data[index];
          svg.append(svgNode('rect',{x:x-width/2,y:y(high),width,height:Math.max(Math.abs(y(span.from)-y(span.to)),1),rx:4,style:`--i:${index}`,class:`chart-bar wf-${span.kind}`+state(index)}));
          if(index<spans.length-1) svg.append(svgNode('path',{d:`M ${x+width/2} ${y(span.to)} H ${x+step-width/2}`,class:'chart-connector'+state(index+1)}));
          const label=item.display || (span.kind==='total'?'':item.value>=0?'+':'')+numberFormat(item.value)+(spec.unit||'');
          svgText(svg,x,y(high)-12,label,'chart-value'+state(index));
        });
      } else {
        const width=Math.min(84,step*.62);
        data.forEach((item,index)=>{
          const x=left+step*(index+.5), height=bottom-y(item.value);
          svg.append(svgNode('rect',{x:x-width/2,y:y(item.value),width,height:Math.max(height,0),rx:6,style:`--i:${index}`,class:'chart-bar series-0'+tone(index)+state(index)}));
          svgText(svg,x,y(item.value)-12,display(item),'chart-value'+state(index));
        });
