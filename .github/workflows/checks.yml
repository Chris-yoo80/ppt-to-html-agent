name: Check skill tools
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check skills/ppt-to-html/assets/player.js
      - run: node --check skills/ppt-to-html/assets/motion-stories.js
      - run: node --test tests/motion.test.cjs tests/player.test.cjs tests/analysis.test.cjs
      - run: node --check skills/ppt-to-html/assets/analysis-ui.js
      - run: node --check skills/ppt-to-html/assets/supplements.js
      - run: node --check docs/site.js
      - run: python skills/ppt-to-html/scripts/build_deck.py examples/library/deck.json --output docs/library-demo.html
      - run: python skills/ppt-to-html/scripts/build_motion_demo.py examples/motion-stories/stories.json --output docs/demo.html
      - run: python tools/build_guides.py
      - run: python tools/build_marketing_examples.py
      - run: python tools/package_skill.py
      - run: python tools/localize_site.py
      - run: python tools/check_release.py
      - run: git diff --exit-code -- docs/*.html examples/marketing-analysis/*.json skills/ppt-to-html/assets/guide.*.html docs/downloads/ppt-to-html.zip
